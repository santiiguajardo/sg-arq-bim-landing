    // dir > 0: se baja de piso (la imagen nueva entra desde arriba); dir < 0: se sube
    next.style.transition = 'none';
    next.style.transform = dir ? 'translateY(' + (dir > 0 ? '-7%' : '7%') + ') scale(1.04)' : 'none';
    void next.offsetWidth;
    next.style.transition = '';
    next.style.transform = 'none';
    if (m && m.video) {
      var v = document.createElement('video');
      v.src = m.video; v.muted = true; v.loop = m.loop !== false; v.playsInline = true; v.autoplay = true;
      v.setAttribute('playsinline', ''); v.setAttribute('muted', '');
      v.poster = m.image || poster(m.video);
      next.appendChild(v);
      var p = v.play();
      if (p && p.catch) p.catch(function () {});
    } else if (m && m.image) {
      var im = new Image();
      im.src = m.image; im.alt = '';
      next.appendChild(im);
    }
    next.classList.add('on');
    if (active >= 0) {
      var old = layers[active];
      if (dir) old.style.transform = 'translateY(' + (dir > 0 ? '7%' : '-7%') + ')';
      old.classList.remove('on');
      setTimeout(function () {
        if (!old.classList.contains('on')) {
          var ov = old.querySelector('video');
          if (ov) ov.pause();
        }
      }, 1000);
    }
    active = (active + 1) % 2;
  }

  function sceneBg(s) {
    if (s.type === 'floors') {
      var f0 = floorsOf(s)[0];
      if (f0) return { image: f0.image };
    }
    if (s.loop && (s.loop.video || s.loop.image)) return s.loop;
    var first = (s.items || []).filter(function (i) { return i && i.src; })[0];
    if (first) return isVideo(first.src) ? { video: first.src } : { image: first.src };
    return introBg();
  }
  function introBg() {
    return (intro.video || intro.image) ? { video: intro.video, image: intro.image, loop: intro.loop } : null;
  }

  /* ---------- Transicion (video de IA) ---------- */
  var trBox = $('tr');
  var trVid = trBox.querySelector('video');
  var trEnd = null;

  function playTransition(src, prepare) {
    if (!src || reduce) { prepare(); return; }
    var finished = false;
    var timer;
    function end() {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      trVid.onended = null; trVid.onerror = null;
      trVid.pause();
      trEnd = null;
      prepare();                       // la escena nueva se arma mientras el video todavía tapa la pantalla
      trBox.classList.remove('on');
    }
    trEnd = end;
    trVid.muted = true;
    trVid.setAttribute('playsinline', '');
    trVid.src = src;
    trVid.onended = end;
    trVid.onerror = end;
    trBox.classList.add('on');
    var p = trVid.play();
    if (p && p.catch) p.catch(end);
    timer = setTimeout(end, 25000);
  }
  $('skip').addEventListener('click', function () { if (trEnd) trEnd(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && trEnd) trEnd(); });

  /* ---------- Navegacion ---------- */
  var panel = $('panel');
  var introEl = $('intro');
  var current = null;
  var busy = false;

  function markMenu() {
    Array.prototype.forEach.call(document.querySelectorAll('#drawer nav button'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-go') === current);
    });
  }

  function setHash(id) {
    try { history.replaceState(null, '', '#/' + id); } catch (e) { /* file:// u otro contexto sin history */ }
  }

  function showIntro() {
    if (busy) return;
    current = 'intro';
    document.body.classList.remove('in-floors');
    introEl.classList.remove('gone');
    panel.classList.add('hide');
    setBackground(introBg());
    markMenu();
    setHash('inicio');
  }

  function go(id, opts) {
    opts = opts || {};
    closeMenu();
    if (id === 'intro' || id === 'inicio') { showIntro(); return; }
    var s = byId[id];
    if (!s || busy || current === id) return;
    busy = true;
    var show = function () {
      current = id;
      introEl.classList.add('gone');
      renderScene(s);
      setBackground(sceneBg(s));
      panel.classList.remove('hide');
      markMenu();
      setHash(keyOf[id]);
      busy = false;
      preloadNext(s);
    };
    panel.classList.add('hide');
    var tr = opts.video || (s.transition && s.transition.video);
    if (tr && !opts.instant) playTransition(tr, show);
    else setTimeout(show, opts.instant ? 0 : 280);
  }

  var preloaded = {};
  function preloadNext(s) {
    var i = scenes.indexOf(s);
    var nxt = scenes[i + 1];
    var src = nxt && nxt.transition && nxt.transition.video;
    if (!src || preloaded[src]) return;
    preloaded[src] = true;
    var v = document.createElement('video');
    v.preload = 'auto'; v.muted = true; v.src = src;
  }

  /* ---------- Menu ---------- */
  function buildMenu() {
    var items = [{ id: 'inicio', label: 'Inicio' }].concat(scenes.map(function (s) {
      return { id: s.id, label: s.menu || s.title || 'Sección' };
    }));
    $('menuNav').innerHTML = items.map(function (it) {
      return '<button type="button" data-go="' + esc(it.id) + '">' + esc(it.label) + '</button>';
    }).join('');
    Array.prototype.forEach.call($('menuNav').querySelectorAll('button'), function (b) {
      b.addEventListener('click', function () { go(b.getAttribute('data-go')); });
    });

    var foot = [];
    if (contact.phone) foot.push('<a href="tel:' + esc(String(contact.phone).replace(/[^\d+]/g, '')) + '">' + esc(contact.phone) + '</a>');
    if (contact.email) foot.push('<a href="mailto:' + esc(contact.email) + '">' + esc(contact.email) + '</a>');
    if (contact.instagram) foot.push('<a href="' + esc(contact.instagram) + '" target="_blank" rel="noopener">Instagram</a>');
    if (contact.website) foot.push('<a href="' + esc(/^https?:/.test(contact.website) ? contact.website : 'https://' + contact.website) + '" target="_blank" rel="noopener">' + esc(contact.website) + '</a>');
    foot.push('<span class="credit">Showroom por SG ARQ BIM</span>');
    $('menuFoot').innerHTML = foot.join('');
  }

  function openMenu() { document.body.classList.add('menu-open'); }
  function closeMenu() { document.body.classList.remove('menu-open'); }
  $('menuBtn').addEventListener('click', openMenu);
  $('menuClose').addEventListener('click', closeMenu);
  $('drawerBack').addEventListener('click', closeMenu);

  /* ---------- Contenido de cada seccion ---------- */
  function head(s) {
    return '<p class="eyebrow">' + esc(C.name || '') + '</p><h2>' + esc(s.title || '') + '</h2>' +
      (s.description ? '<p class="desc">' + esc(s.description) + '</p>' : '');
  }

  function renderScene(s) {
    var html;
    document.body.classList.remove('in-floors');
    if (s.type === 'floors' && floorsOf(s).length) {
      panel.innerHTML = '';
      enterFloors(s);
      return;
    }
    if (s.type === 'floors') html = head(s) + '<p class="empty">Las plantas de los pisos se están preparando.</p>';
    else if (s.type === 'location') html = renderLocation(s);
    else if (s.type === 'contact') html = renderContact(s);
    else html = renderGallery(s);
    panel.innerHTML = '<div class="card" id="card">' + html + '</div>';
    if (s.type === 'units') wireUnits(s);
    else if (s.type === 'contact') wireContact();
    else if (s.type === 'gallery') wireGallery(s);
    var card = $('card');
    if (card) card.scrollTop = 0;
  }

  /* Galeria */
  function galleryItems(s) { return (s.items || []).filter(function (i) { return i && i.src; }); }

  function renderGallery(s) {
    var items = galleryItems(s);
    var html = head(s);
    if (items.length) {
      html += '<div class="gal">' + items.map(function (it, k) {
        var vid = isVideo(it.src);
        return '<button type="button" data-k="' + k + '" aria-label="' + esc(it.caption || ('Abrir ' + (k + 1))) + '">' +
          '<img loading="lazy" alt="" src="' + esc(vid ? poster(it.src) : it.src) + '">' +
          (vid ? '<span class="vp">&#9654;</span>' : '') + '</button>';
      }).join('') + '</div>';
      html += '<p class="gal-more">' + items.length + (items.length === 1 ? ' foto o video' : ' fotos y videos') + ' · tocá para ampliar</p>';
    }
    return html;
  }
  function wireGallery(s) {
    var items = galleryItems(s);
    Array.prototype.forEach.call(panel.querySelectorAll('.gal button'), function (b) {
      b.addEventListener('click', function () { openLightbox(items, Number(b.getAttribute('data-k'))); });
    });
  }

  /* Unidades */
  var uFilter = { status: 'todas', rooms: 'todas' };

  function priceText(u) {
    if (!(Number(u.price) > 0)) return 'Consultar';
    return esc((u.currency || 'USD') + ' ' + Number(u.price).toLocaleString('es-AR'));
  }

  function renderUnits(s) {
    var units = s.units || [];
    var html = head(s);
    if (!units.length) return html + '<p class="empty">Todavía no hay unidades cargadas.</p>';
    var statuses = ['disponible', 'reservada', 'vendida'].filter(function (st) {
      return units.some(function (u) { return u.status === st; });
    });
    var rooms = [];
    units.forEach(function (u) { if (u.rooms && rooms.indexOf(String(u.rooms)) < 0) rooms.push(String(u.rooms)); });
    rooms.sort(function (a, b) { return Number(a) - Number(b); });
    html += '<div class="chips" id="fStatus">' +
      ['todas'].concat(statuses).map(function (st) {
        return '<button type="button" class="chip' + (uFilter.status === st ? ' on' : '') + '" data-v="' + st + '">' + (st === 'todas' ? 'Todas' : st.charAt(0).toUpperCase() + st.slice(1)) + '</button>';
      }).join('') + '</div>';
    if (rooms.length > 1) {
      html += '<div class="chips" id="fRooms">' +
        ['todas'].concat(rooms).map(function (r) {
          return '<button type="button" class="chip' + (uFilter.rooms === r ? ' on' : '') + '" data-v="' + r + '">' + (r === 'todas' ? 'Cualquier tamaño' : r + ' amb.') + '</button>';
        }).join('') + '</div>';
    }
    html += '<div class="units" id="unitList">' + unitCards(s) + '</div>';
    return html;
  }

  function unitCards(s) {
    var list = (s.units || []).filter(function (u) {
      return (uFilter.status === 'todas' || u.status === uFilter.status) &&
        (uFilter.rooms === 'todas' || String(u.rooms) === uFilter.rooms);
    });
    if (!list.length) return '<p class="empty">No hay unidades con ese filtro.</p>';
    return list.map(function (u) {
      var meta = [u.level ? 'Piso ' + u.level : '', u.area ? u.area + ' m²' : '', u.rooms ? u.rooms + ' amb.' : ''].filter(Boolean).join(' · ');
      var link = waLink('Hola, me interesa la unidad ' + (u.code || '') + ' de ' + (C.name || '') + '.');
      var st = u.status || 'disponible';
      return '<div class="unit ' + esc(st) + '"><b>' + esc(u.code || 'Unidad') + '</b><span class="price">' + priceText(u) + '</span>' +
        '<span class="meta">' + esc(meta) + '</span>' +
        '<div class="act"><span class="st ' + esc(st) + '">' + esc(st) + '</span>' +
        (link && st !== 'vendida' ? '<a class="btn sm primary" target="_blank" rel="noopener" href="' + link + '">Consultar</a>' : '') + '</div></div>';
    }).join('');
  }

  function wireUnits(s) {
    function bind(id, key) {
      var box = $(id);
      if (!box) return;
      Array.prototype.forEach.call(box.querySelectorAll('button'), function (b) {
        b.addEventListener('click', function () {
          uFilter[key] = b.getAttribute('data-v');
          Array.prototype.forEach.call(box.querySelectorAll('button'), function (x) { x.classList.toggle('on', x === b); });
          $('unitList').innerHTML = unitCards(s);
        });
      });
    }
    bind('fStatus', 'status');
    bind('fRooms', 'rooms');
  }

  /* Ubicacion */
  function hasCoords() { return isFinite(parseFloat(contact.lat)) && isFinite(parseFloat(contact.lng)); }

  function renderLocation(s) {
    var html = head(s);
    if (hasCoords()) {
      var lat = parseFloat(contact.lat), lng = parseFloat(contact.lng);
      var bbox = [lng - 0.004, lat - 0.003, lng + 0.004, lat + 0.003].join('%2C');
      html += '<iframe class="map" loading="lazy" title="Mapa" src="https://www.openstreetmap.org/export/embed.html?bbox=' + bbox + '&layer=mapnik&marker=' + lat + '%2C' + lng + '"></iframe>';
    }
    if (contact.address) html += '<p class="desc" style="margin-bottom:12px">' + esc(contact.address) + '</p>';
    var pois = (s.pois || []).filter(function (p) { return p && p.name; });
    if (pois.length) {
      html += pois.map(function (p) { return '<div class="poi"><span>' + esc(p.name) + '</span><span>' + esc(p.distance || '') + '</span></div>'; }).join('');
    }
    if (hasCoords()) {
      html += '<div class="row" style="margin-top:14px"><a class="btn primary" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=' + parseFloat(contact.lat) + ',' + parseFloat(contact.lng) + '">Cómo llegar</a></div>';
    }
    return html;
  }

  /* Contacto */
  function renderContact(s) {
    var html = head(s);
    var link = waLink('Hola, quiero más información sobre ' + (C.name || 'el proyecto') + '.');
    html += '<div class="row">';
    if (link) html += '<a class="btn primary" target="_blank" rel="noopener" href="' + link + '">Escribir por WhatsApp</a>';
    if (contact.phone) html += '<a class="btn" href="tel:' + esc(String(contact.phone).replace(/[^\d+]/g, '')) + '">Llamar</a>';
    if (contact.email) html += '<a class="btn" href="mailto:' + esc(contact.email) + '">Email</a>';
    html += '</div>';
    var info = [];
    if (contact.address) info.push(esc(contact.address));
    if (contact.phone) info.push(esc(contact.phone));
    if (contact.email) info.push(esc(contact.email));
    if (info.length) html += '<div class="cinfo">' + info.map(function (i) { return '<span>' + i + '</span>'; }).join('') + '</div>';
    if (waDigits()) {
      html += '<form class="form" id="cForm"><input name="name" placeholder="Tu nombre" required>' +
        '<textarea name="msg" placeholder="¿Qué te gustaría saber?"></textarea>' +
        '<button class="btn primary" type="submit">Enviar consulta</button></form>';
    }
    return html;
  }
  function wireContact() {
    var f = $('cForm');
    if (!f) return;
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var name = f.elements.name.value.trim();
      var msg = f.elements.msg.value.trim();
      var text = 'Hola, soy ' + name + '. Consulta sobre ' + (C.name || 'el proyecto') + (msg ? ': ' + msg : '.');
      window.open(waLink(text), '_blank', 'noopener');
    });
  }

  /* ---------- Pisos: se empieza en la terraza y se va bajando ---------- */
  var floors = [];
  var floorIdx = -1;
  var floorsScene = null;

  function floorsOf(s) { return (s.floors || []).filter(function (f) { return f && f.image; }); }

  function levelKey(v) {
    var l = String(v == null ? '' : v).toLowerCase().trim();
    if (l === '0' || l === 'pb' || l === 'planta baja') return 'pb';
    return l.replace(/^piso\s*/, '');
  }

  function unitsOnFloor(f) {
    var want = levelKey(f.level);
    var out = [];
    scenes.forEach(function (sc) {
      if (sc.type !== 'units') return;
      (sc.units || []).forEach(function (u) { if (want && levelKey(u.level) === want) out.push(u); });
    });
    return out;
  }

  function buildFloorNav() {
    var list = $('fList');
    list.innerHTML = floors.map(function (f, i) {
      return '<button type="button" data-i="' + i + '">' + esc(f.short || f.label) + '</button>';
    }).join('');
    Array.prototype.forEach.call(list.querySelectorAll('button'), function (b) {
      b.addEventListener('click', function () { selectFloor(Number(b.getAttribute('data-i'))); });
    });
  }

  function selectFloor(i, force) {
    if (i < 0 || i >= floors.length) return;
    var dir = floorIdx < 0 ? 0 : (i > floorIdx ? 1 : (i < floorIdx ? -1 : 0));
    if (i === floorIdx && !force) return;
    floorIdx = i;
    var f = floors[i];
    setBackground({ image: f.image }, dir);
    Array.prototype.forEach.call($('fList').children, function (b, k) {
      b.classList.toggle('on', k === i);
      if (k === i) b.scrollIntoView({ block: 'nearest' });
    });
    $('fUp').disabled = i === 0;
    $('fDown').disabled = i === floors.length - 1;
    var us = unitsOnFloor(f);
    var free = us.filter(function (u) { return (u.status || 'disponible') === 'disponible'; }).length;
    $('floorInfo').innerHTML = '<strong>' + esc(f.label) + '</strong>' +
      (us.length ? '<span>' + free + ' disponible' + (free === 1 ? '' : 's') + ' de ' + us.length + ' unidad' + (us.length === 1 ? '' : 'es') + '</span>' : '');
  }

  function enterFloors(s) {
    floorsScene = s;
    floors = floorsOf(s).map(function (f) { return f; });
    floorIdx = -1;
    buildFloorNav();
    document.body.classList.add('in-floors');
    selectFloor(0, true);
  }

  function stepFloor(d) {
    if (!document.body.classList.contains('in-floors') || $('lb').classList.contains('on')) return;
    selectFloor(Math.max(0, Math.min(floors.length - 1, floorIdx + d)));
  }
  $('fUp').addEventListener('click', function () { stepFloor(-1); });
  $('fDown').addEventListener('click', function () { stepFloor(1); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { stepFloor(1); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { stepFloor(-1); e.preventDefault(); }
  });
  var wheelLock = 0;
  window.addEventListener('wheel', function (e) {
    if (!document.body.classList.contains('in-floors')) return;
    if (document.body.classList.contains('menu-open') || $('lb').classList.contains('on') || Math.abs(e.deltaY) < 20 || Date.now() - wheelLock < 650) return;
    wheelLock = Date.now();
    stepFloor(e.deltaY > 0 ? 1 : -1);
  }, { passive: true });

  /* ---------- Visor de fotos y videos ---------- */
  var lb = { items: [], i: 0 };

  function openLightbox(items, k) {
    lb.items = items; lb.i = k;
    $('lb').classList.add('on');
    var strip = $('lbStrip');
    strip.innerHTML = items.map(function (it, n) {
      var vid = isVideo(it.src);
      return '<button type="button" data-n="' + n + '"><img alt="" src="' + esc(vid ? poster(it.src) : it.src) + '">' + (vid ? '<span class="vp">&#9654;</span>' : '') + '</button>';
    }).join('');
    Array.prototype.forEach.call(strip.querySelectorAll('button'), function (b) {
      b.addEventListener('click', function () { lb.i = Number(b.getAttribute('data-n')); showLightbox(); });
    });
    showLightbox();
  }
  function showLightbox() {
    var it = lb.items[lb.i];
    var main = $('lbMedia');
    main.innerHTML = '';
    if (isVideo(it.src)) {
      var v = document.createElement('video');
      v.src = it.src; v.controls = true; v.autoplay = true; v.playsInline = true; v.poster = poster(it.src);
      main.appendChild(v);
    } else {
      var im = new Image();
      im.src = it.src; im.alt = it.caption || '';
      main.appendChild(im);
    }
    $('lbCap').textContent = (it.caption ? it.caption + ' · ' : '') + (lb.i + 1) + ' / ' + lb.items.length;
    Array.prototype.forEach.call($('lbStrip').children, function (b, n) {
      b.classList.toggle('on', n === lb.i);
      if (n === lb.i) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
    var multi = lb.items.length > 1;
    $('lbPrev').hidden = !multi;
    $('lbNext').hidden = !multi;
    $('lbStrip').hidden = !multi;
  }
  function stepLightbox(d) {
    lb.i = (lb.i + d + lb.items.length) % lb.items.length;
    showLightbox();
  }
  function closeLightbox() {
    $('lb').classList.remove('on');
    var v = $('lbMedia').querySelector('video');
    if (v) v.pause();
    $('lbMedia').innerHTML = '';
  }
  $('lbClose').addEventListener('click', closeLightbox);
  $('lbPrev').addEventListener('click', function () { stepLightbox(-1); });
  $('lbNext').addEventListener('click', function () { stepLightbox(1); });
  document.addEventListener('keydown', function (e) {
    if (!$('lb').classList.contains('on')) return;
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowRight') stepLightbox(1);
    else if (e.key === 'ArrowLeft') stepLightbox(-1);
  });

  /* ---------- Arranque ---------- */
  function initIntro() {
    var h = '';
    if (C.logo) h += '<img class="logo" alt="' + esc(C.name || '') + '" src="' + esc(C.logo) + '">';
    h += '<h1>' + esc(intro.title || C.name || '') + '</h1>';
    var sub = intro.subtitle || C.tagline;
    if (sub) h += '<p>' + esc(sub) + '</p>';
    if (scenes.length) h += '<button id="enter" type="button">' + esc(intro.button || 'Ingresar') + '</button>';
    introEl.innerHTML = h;
    var enter = $('enter');
    if (enter) enter.addEventListener('click', function () { go(scenes[0].id, { video: intro.enterVideo }); });
  }

  function initTopbar() {
    $('brand').innerHTML = (C.logo ? '<img alt="" src="' + esc(C.logo) + '">' : '') + (C.logo ? '' : '<span>' + esc(C.name || '') + '</span>');
    $('brand').addEventListener('click', function () { go('inicio'); });
    var link = waLink('Hola, quiero más información sobre ' + (C.name || 'el proyecto') + '.');
    var wa = $('waBtn');
    if (link) wa.href = link; else wa.hidden = true;
    var fs = $('fsBtn');
    if (!document.documentElement.requestFullscreen) fs.hidden = true;
    var fsLabel = fs.querySelector('.lbl');
    function fsText() { fsLabel.textContent = document.fullscreenElement ? 'Salir de pantalla completa' : 'Pantalla completa'; }
    fsText();
    document.addEventListener('fullscreenchange', fsText);
    fs.addEventListener('click', function () {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    });
  }

  buildMenu();
  initIntro();
  initTopbar();

  var start = (location.hash || '').replace(/^#\/?/, '');
  var startId = idOfKey[start] || (byId[start] ? start : '');
  if (startId) {
    go(startId, { instant: true });
  } else {
    showIntro();
  }
})();
</script>
</body>
</html>
