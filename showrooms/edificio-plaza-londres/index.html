<style>/* Showroom virtual — estilos comunes a todas las páginas generadas.
   Todos los showrooms comparten este archivo: solo cambian el color de acento, el logo y el contenido. */
:root {
  --accent: #2f6fed;
  --ink: #f4f5f8;
  --ink-soft: #b4b9c6;
  --glass: rgba(14, 16, 22, .62);
  --glass-line: rgba(255, 255, 255, .16);
  --font-body: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0b0c10; color: var(--ink); font-family: var(--font-body); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font-family: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
[hidden] { display: none !important; }

/* ---------- Fondo (dos capas para el fundido) ---------- */
#stage { position: fixed; inset: 0; background: #0b0c10; }
.bg { position: absolute; inset: 0; opacity: 0; transition: opacity .9s ease, transform 1s cubic-bezier(.2,.7,.2,1); }
.bg.on { opacity: 1; }
.bg video, .bg img { width: 100%; height: 100%; object-fit: cover; display: block; }
#shade { position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(8,9,12,.55) 0%, rgba(8,9,12,.05) 32%, rgba(8,9,12,.05) 55%, rgba(8,9,12,.72) 100%); }

/* ---------- Barra superior ---------- */
#topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; pointer-events: none; }
#topbar > * { pointer-events: auto; }
.pill { text-decoration: none; display: inline-flex; align-items: center; gap: 9px; height: 42px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--glass-line); background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); font-weight: 600; font-size: 14px; }
.pill:hover { background: rgba(14, 16, 22, .82); }
.round { width: 42px; height: 42px; padding: 0; justify-content: center; }
.burger { width: 16px; height: 12px; position: relative; display: inline-block; }
.burger::before, .burger::after, .burger i { content: ''; position: absolute; left: 0; right: 0; height: 2px; border-radius: 2px; background: currentColor; }
.burger::before { top: 0; } .burger i { top: 5px; } .burger::after { bottom: 0; }
#brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -.02em; font-size: 16px; text-shadow: 0 1px 12px rgba(0,0,0,.5); }
#brand img { height: 30px; width: auto; max-width: 120px; object-fit: contain; }
.tb-right { display: flex; gap: 8px; }
#fsBtn { gap: 8px; padding: 0 16px; }
#fsBtn .ico { font-size: 16px; line-height: 1; }

/* ---------- Portada ---------- */
#intro { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; transition: opacity .6s ease, visibility .6s; }
#intro.gone { opacity: 0; visibility: hidden; pointer-events: none; }
#intro .logo { max-height: 120px; max-width: min(70vw, 360px); object-fit: contain; margin-bottom: 18px; filter: drop-shadow(0 6px 24px rgba(0,0,0,.45)); }
#intro h1 { margin: 0; font-weight: 600; font-size: clamp(2.2rem, 7vw, 4.6rem); letter-spacing: -.04em; line-height: 1.02; text-shadow: 0 4px 30px rgba(0,0,0,.45); text-wrap: balance; }
#intro p { margin: 14px 0 0; max-width: 560px; font-size: clamp(1rem, 2.4vw, 1.2rem); color: #e6e9f0; text-shadow: 0 2px 16px rgba(0,0,0,.5); }
#enter { margin-top: 34px; height: 54px; padding: 0 44px; border: 0; border-radius: 999px; background: #fff; color: #10131a; font-weight: 700; font-size: 16px; box-shadow: 0 10px 40px rgba(0,0,0,.35); transition: transform .15s; }
#enter:hover { transform: translateY(-2px); }

/* ---------- Menu ---------- */
#drawerBack { position: fixed; inset: 0; z-index: 40; background: rgba(5,6,9,.5); opacity: 0; visibility: hidden; transition: opacity .3s, visibility .3s; }
#drawer { position: fixed; top: 0; bottom: 0; left: 0; z-index: 41; width: min(360px, 88vw); padding: 22px 22px 18px; display: flex; flex-direction: column; background: rgba(12, 14, 19, .94); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-right: 1px solid var(--glass-line); transform: translateX(-102%); transition: transform .35s cubic-bezier(.2,.7,.2,1); }
body.menu-open #drawer { transform: none; }
body.menu-open #drawerBack { opacity: 1; visibility: visible; }
.d-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.d-head strong { font-size: 18px; letter-spacing: -.02em; }
.d-head img { max-height: 34px; max-width: 160px; object-fit: contain; }
#drawer nav { display: flex; flex-direction: column; gap: 2px; flex: 1; overflow-y: auto; }
#drawer nav button { text-align: left; background: transparent; border: 0; padding: 13px 12px; border-radius: 10px; font-size: 17px; font-weight: 600; letter-spacing: -.01em; color: var(--ink-soft); }
#drawer nav button:hover { background: rgba(255,255,255,.06); color: #fff; }
#drawer nav button.on { color: #fff; background: color-mix(in srgb, var(--accent) 30%, transparent); }
.d-foot { border-top: 1px solid var(--glass-line); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; font-size: 13.5px; color: var(--ink-soft); }
.d-foot a { text-decoration: none; }
.d-foot a:hover { color: #fff; }
.d-foot .credit { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; opacity: .7; margin-top: 6px; }

/* ---------- Panel de contenido ---------- */
#panel { position: fixed; z-index: 10; left: 24px; bottom: 24px; top: 84px; width: min(500px, calc(100vw - 48px)); display: flex; flex-direction: column; justify-content: flex-end; pointer-events: none; transition: opacity .5s ease, transform .5s ease; }
#panel.hide { opacity: 0; transform: translateY(14px); }
.card { pointer-events: auto; max-height: 100%; overflow-y: auto; padding: 26px 26px 22px; border-radius: 22px; border: 1px solid var(--glass-line); background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.25) transparent; }
.eyebrow { font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: color-mix(in srgb, var(--accent) 55%, #fff); margin: 0 0 10px; }
.card h2 { margin: 0 0 10px; font-size: clamp(1.7rem, 3.4vw, 2.3rem); font-weight: 800; letter-spacing: -.03em; line-height: 1.05; }
.card .desc { margin: 0 0 18px; color: #dfe3ec; font-size: 15.5px; line-height: 1.55; white-space: pre-line; }

/* Galería */
.gal { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.gal button { position: relative; padding: 0; border: 0; border-radius: 12px; overflow: hidden; aspect-ratio: 4 / 3; background: #1a1d26; }
.gal img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .35s; }
.gal button:hover img { transform: scale(1.06); }
.gal .vp { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.28); font-size: 20px; }
.gal-more { margin-top: 10px; font-size: 12.5px; color: var(--ink-soft); }

/* Unidades */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.chip { height: 32px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--glass-line); background: transparent; font-size: 13px; font-weight: 600; color: var(--ink-soft); }
.chip.on { background: #fff; color: #10131a; border-color: #fff; }
.units { display: flex; flex-direction: column; gap: 8px; }
.unit { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 13px 14px; border-radius: 14px; border: 1px solid var(--glass-line); background: rgba(255,255,255,.04); }
.unit b { font-size: 16px; letter-spacing: -.01em; }
.unit .meta { grid-column: 1; color: var(--ink-soft); font-size: 13px; }
.unit .price { grid-column: 2; grid-row: 1 / span 2; align-self: center; text-align: right; font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums; }
.unit .act { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; }
.st { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; border: 1px solid currentColor; }
.st.disponible { color: #4ade80; } .st.reservada { color: #fbbf24; } .st.vendida { color: #f87171; }
.unit.vendida { opacity: .55; }
.empty { color: var(--ink-soft); font-size: 14px; padding: 8px 0; }

/* Ubicacion */
.map { width: 100%; height: 230px; border: 0; border-radius: 14px; margin-bottom: 14px; filter: grayscale(.25) contrast(1.05); }
.poi { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--glass-line); font-size: 14.5px; }
.poi span:last-child { color: var(--ink-soft); white-space: nowrap; }

/* Botones y contacto */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 22px; border-radius: 12px; border: 1px solid var(--glass-line); background: transparent; font-weight: 700; font-size: 14.5px; text-decoration: none; }
.btn.primary { background: #fff; color: #10131a; border-color: #fff; }
.btn:hover { transform: translateY(-1px); }
.btn.sm { height: 36px; padding: 0 16px; font-size: 13px; border-radius: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.cinfo { margin: 16px 0 0; display: flex; flex-direction: column; gap: 6px; font-size: 14.5px; color: #dfe3ec; }
.form { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
.form input, .form textarea { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--glass-line); background: rgba(255,255,255,.06); color: #fff; font: inherit; font-size: 14.5px; }
.form input::placeholder, .form textarea::placeholder { color: #8c92a1; }
.form textarea { min-height: 84px; resize: vertical; }

/* ---------- Transicion (video de IA entre secciones) ---------- */
#tr { position: fixed; inset: 0; z-index: 60; background: #000; opacity: 0; visibility: hidden; transition: opacity .35s ease, visibility .35s; }
#tr.on { opacity: 1; visibility: visible; }
#tr video { width: 100%; height: 100%; object-fit: cover; }
#skip { position: absolute; right: 18px; bottom: 22px; }

/* ---------- Visor de fotos / videos ---------- */
#lb { position: fixed; inset: 0; z-index: 70; background: rgba(4,5,8,.94); display: none; flex-direction: column; }
#lb.on { display: flex; }
#lbMain { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 56px 64px 8px; }
#lbMain img, #lbMain video { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; }
#lbClose { position: absolute; top: 14px; right: 14px; z-index: 2; }
.lb-nav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; }
#lbPrev { left: 12px; } #lbNext { right: 12px; }
#lbStrip { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px 16px; justify-content: center; scrollbar-width: thin; }
#lbStrip button { flex: 0 0 auto; width: 92px; height: 64px; padding: 0; border: 2px solid transparent; border-radius: 9px; overflow: hidden; background: #1a1d26; opacity: .6; position: relative; }
#lbStrip button.on { opacity: 1; border-color: var(--accent); }
#lbStrip img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
#lbStrip .vp { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.3); font-size: 14px; }
#lbCap { text-align: center; color: var(--ink-soft); font-size: 13px; padding: 0 16px 4px; min-height: 20px; }

/* ---------- Pisos (de la terraza hacia abajo) ---------- */
#floorNav { position: fixed; z-index: 15; right: 16px; top: 76px; bottom: 24px; width: 84px; display: none; flex-direction: column; gap: 6px; padding: 8px; border-radius: 18px; border: 1px solid var(--glass-line); background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
body.in-floors #floorNav { display: flex; }
#fList { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; scrollbar-width: none; }
#fList::-webkit-scrollbar { display: none; }
#fList button, .f-step { flex: 0 0 auto; min-height: 42px; padding: 6px 4px; border-radius: 11px; border: 0; background: rgba(255,255,255,.92); color: #10131a; font-weight: 700; font-size: 12.5px; line-height: 1.15; text-align: center; }
#fList button:hover, .f-step:hover { background: #fff; }
#fList button.on { background: var(--accent); color: #fff; }
.f-step { min-height: 34px; background: rgba(255,255,255,.14); color: #fff; font-size: 14px; }
.f-step:hover { background: rgba(255,255,255,.28); }
.f-step:disabled { opacity: .3; cursor: default; }
#floorInfo { position: fixed; z-index: 15; left: 24px; bottom: 24px; display: none; flex-direction: column; min-width: 230px; max-width: min(340px, calc(100vw - 130px)); border-radius: 16px; border: 1px solid var(--glass-line); background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); overflow: hidden; }
body.in-floors #floorInfo { display: flex; }
.fi-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; width: 100%; padding: 13px 16px; border: 0; background: transparent; color: inherit; text-align: left; cursor: default; }
#floorInfo.has-list .fi-head { cursor: pointer; }
.fi-t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fi-t strong { font-size: 21px; letter-spacing: -.02em; }
.fi-sub { font-size: 12.5px; color: var(--ink-soft); }
.fi-chev { font-size: 13px; color: var(--ink-soft); transition: transform .2s; }
#floorInfo.open .fi-chev { transform: rotate(180deg); }
.fi-list { display: none; flex-direction: column; max-height: 42vh; overflow-y: auto; border-top: 1px solid var(--glass-line); scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.25) transparent; }
#floorInfo.open .fi-list { display: flex; }
.fi-row { display: grid; grid-template-columns: 12px auto 1fr auto; gap: 10px; align-items: center; width: 100%; padding: 10px 16px; border: 0; border-top: 1px solid rgba(255,255,255,.06); background: transparent; color: inherit; text-align: left; font-size: 13.5px; }
.fi-row:first-child { border-top: 0; }
.fi-row:hover { background: rgba(255,255,255,.07); }
.fi-row i { width: 10px; height: 10px; border-radius: 50%; }
.fi-row span { color: var(--ink-soft); font-size: 12.5px; }
.fi-row em { font-style: normal; font-size: 12px; font-weight: 700; }
#floorInfo .lg { display: flex; gap: 12px; padding: 0 16px 13px; flex-wrap: wrap; }
#floorInfo .lg span { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink); }
#floorInfo .lg span::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
body.in-floors #panel { display: none; }

.map.lm { position: relative; z-index: 0; isolation: isolate; height: 340px; filter: none; background: #1a1d26; overflow: hidden; }
.map.lm .maplibregl-ctrl-attrib { font-size: 10px; }
.poi-pill { display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 7px; margin-left: 4px; border-radius: 999px; background: #fff; color: #10131a; font-size: 11.5px; font-weight: 700; box-shadow: 0 1px 6px rgba(0,0,0,.35); white-space: nowrap; max-width: 210px; overflow: hidden; text-overflow: ellipsis; }
.poi-pill i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.pd { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; }
.mk-wrap { width: 34px; height: 34px; }
.mk { width: 34px; height: 34px; border-radius: 50% 50% 50% 0; background: var(--accent); border: 3px solid #fff; box-shadow: 0 3px 10px rgba(0,0,0,.5); transform: rotate(-45deg); }
.addr { margin: 0 0 12px; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }

/* ---------- Plantas con unidades ---------- */
#floorStage { position: fixed; z-index: 12; display: none; pointer-events: none; transition: opacity .35s ease; }
body.in-floors #floorStage { display: block; }
#floorStage.swap { opacity: 0; }
#floorStage svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
#floorStage .zone { fill: var(--c); fill-opacity: .26; stroke: var(--c); stroke-opacity: .75; stroke-width: 2; vector-effect: non-scaling-stroke; pointer-events: all; cursor: pointer; transition: fill-opacity .2s, stroke-opacity .2s; }
#floorStage .zone:hover { fill-opacity: .42; }
#floorStage .zone.sel { fill-opacity: .58; stroke-opacity: 1; stroke-width: 3.5; }
.pin { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; display: flex; align-items: center; gap: 6px; padding: 5px 11px 5px 8px; border: 0; border-radius: 999px; background: #fff; color: #10131a; font-weight: 700; font-size: 13px; letter-spacing: -.01em; box-shadow: 0 2px 10px rgba(0,0,0,.4); white-space: nowrap; transition: transform .15s, background .2s; }
.pin i { width: 11px; height: 11px; border-radius: 50%; background: var(--c); flex: none; }
.pin:hover { transform: translate(-50%, -50%) scale(1.08); }
.pin.sel { background: var(--c); color: #0b0c10; transform: translate(-50%, -50%) scale(1.14); z-index: 2; }
.pin.sel i { background: #fff; }

#unitCard { position: fixed; z-index: 16; left: 16px; top: 76px; width: 330px; max-height: calc(100vh - 100px); overflow-y: auto; border-radius: 20px; border: 1px solid var(--glass-line); background: rgba(12, 14, 19, .9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); scrollbar-width: none; animation: ucIn .3s cubic-bezier(.2,.7,.2,1); }
#unitCard[hidden] { display: none; }
@keyframes ucIn { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
#unitCard::-webkit-scrollbar { display: none; }
.uc-x { position: absolute; z-index: 2; top: 10px; right: 10px; width: 36px; height: 36px; padding: 0; justify-content: center; }
.uc-gal { position: relative; aspect-ratio: 16/10; background: #1a1d26; overflow: hidden; border-radius: 20px 20px 0 0; }
.uc-gal img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
.uc-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border-radius: 50%; border: 0; background: rgba(0,0,0,.5); color: #fff; font-size: 20px; line-height: 1; padding: 0 0 3px; }
.uc-nav.prev { left: 8px; } .uc-nav.next { right: 8px; }
.uc-dots { position: absolute; bottom: 8px; left: 0; right: 0; display: flex; justify-content: center; gap: 5px; pointer-events: none; }
.uc-dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.5); }
.uc-dots i.on { background: #fff; }
.uc-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 12px; }
.uc-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.uc-head h3 { margin: 0; font-size: 20px; letter-spacing: -.02em; }
.uc-st { flex: none; padding: 4px 12px; border-radius: 999px; background: var(--c); color: #0b0c10; font-weight: 800; font-size: 12.5px; }
.uc-price { font-size: 26px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.uc-cta, .uc-tour { width: 100%; }
.uc-rows { margin: 2px 0 0; display: flex; flex-direction: column; }
.uc-rows div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--glass-line); font-size: 14.5px; }
.uc-rows div:last-child { border-bottom: 0; }
.uc-rows dt { color: var(--ink-soft); } .uc-rows dd { margin: 0; font-weight: 700; }
body.card-open #floorInfo { display: none; }
.unit .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

#tour { position: fixed; inset: 0; z-index: 75; background: #000; display: none; }
#tour.on { display: block; }
#tourCv { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#tourCv.grab { cursor: grabbing; }
#tour.flat #tourCv { display: none; }
#tourFlat { display: none; position: absolute; inset: 0; overflow: auto; }
#tour.flat #tourFlat { display: block; }
#tourFlat img { height: 100%; width: auto; max-width: none; display: block; }
#tourMsg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--ink-soft); font-size: 15px; pointer-events: none; }
#tourMsg[hidden] { display: none; }

<script>/* Showroom virtual — comportamiento común a todas las páginas generadas.

    stage.insertBefore(d, $('shade'));
    return d;
  });

  var currentBg = '';

  function setBackground(m, dir) {
    var key = (m && (m.video || m.image)) || '';
    if (key === currentBg) return;
    currentBg = key;
    var next = layers[(active + 1) % 2];
    next.innerHTML = '';

    next.style.transition = 'none';
    next.style.transform = dir ? 'translateY(' + (dir > 0 ? '-7%' : '7%') + ') scale(1.04)' : 'none';
    void next.offsetWidth;

      var v = document.createElement('video');
      v.src = m.video; v.muted = true; v.loop = m.loop !== false; v.playsInline = true; v.autoplay = true;
      v.setAttribute('playsinline', ''); v.setAttribute('muted', '');

  function sceneBg(s) {

      var f0 = floorsOf(s)[0];

    if (s.loop && (s.loop.video || s.loop.image)) return s.loop;

  /* ---------- Menu ---------- */

  function wireUnits(s) {
    function bind(id, key) {
      var box = $(id);
      if (!box) return;
      Array.prototype.forEach.call(box.querySelectorAll('button'), function (b) {
        b.addEventListener('click', function () {

  /* Ubicacion */
  function hasCoords() { return isFinite(parseFloat(contact.lat)) && isFinite(parseFloat(contact.lng)); }

  function renderLocation(s) {
    var html = head(s);
    if (contact.address) html += '<p class="addr">' + esc(contact.address) + '</p>';
    if (hasCoords()) {
      html += '<div class="map lm" id="lmap" role="img" aria-label="Mapa de la ubicación"></div>';
    } else if (contact.address) {
      html += '<iframe class="map" loading="lazy" title="Mapa" src="https://www.google.com/maps?q=' + encodeURIComponent(contact.address) + '&z=16&output=embed"></iframe>';
    }
    var pois = (s.pois || []).filter(function (p) { return p && p.name; });
    if (pois.length) {
      html += pois.map(function (p) { return '<div class="poi"><span>' + (p.color ? '<i class="pd" style="background:' + esc(p.color) + '"></i>' : '') + esc(p.name) + '</span><span>' + esc(p.distance || '') + '</span></div>'; }).join('');
    }
    var dest = hasCoords() ? parseFloat(contact.lat) + ',' + parseFloat(contact.lng) : (contact.address ? encodeURIComponent(contact.address) : '');
    if (dest) {
      html += '<div class="row" style="margin-top:14px"><a class="btn primary" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=' + dest + '">Cómo llegar</a></div>';
    }
    return html;
  }

  /* Mapa real (MapLibre GL + OpenFreeMap, vectorial y sin clave). Si no se puede cargar, queda el mapa embebido. */
  var MAPLIB = 'https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/';
  var mapLibP = null;
  function loadMapLibre() {
    if (window.maplibregl) return Promise.resolve(window.maplibregl);
    if (mapLibP) return mapLibP;
    mapLibP = new Promise(function (ok, fail) {
      var css = document.createElement('link');
      css.rel = 'stylesheet'; css.href = MAPLIB + 'maplibre-gl.css';
      document.head.appendChild(css);
      var sc = document.createElement('script');
      sc.src = MAPLIB + 'maplibre-gl.js';
      sc.onload = function () { ok(window.maplibregl); };
      sc.onerror = function () { mapLibP = null; fail(new Error('maplibre')); };
      document.head.appendChild(sc);
    });
    return mapLibP;
  }

  function wireLocation(s) {
    var el = $('lmap');
    if (!el) return;
    var lat = parseFloat(contact.lat), lng = parseFloat(contact.lng);
    var styles = { liberty: 1, positron: 1, bright: 1 };
    var style = styles[contact.mapStyle] ? contact.mapStyle : 'liberty';
    function fallback() {
      if (!el.isConnected) return;
      var bbox = [lng - 0.004, lat - 0.003, lng + 0.004, lat + 0.003].join('%2C');
      el.outerHTML = '<iframe class="map" title="Mapa" src="https://www.openstreetmap.org/export/embed.html?bbox=' + bbox + '&layer=mapnik&marker=' + lat + '%2C' + lng + '"></iframe>';
    }
    loadMapLibre().then(function (ml) {
      if (!el.isConnected) return;
      var map = new ml.Map({
        container: el, style: 'https://tiles.openfreemap.org/styles/' + style,
        center: [lng, lat], zoom: Number(contact.zoom) || 16,
        pitch: 0, bearing: 0,
        cooperativeGestures: true, attributionControl: { compact: true }
      });
      map.addControl(new ml.NavigationControl({ visualizePitch: true }), 'top-right');
      var pin = document.createElement('div');
      pin.className = 'mk-wrap';
      pin.innerHTML = '<div class="mk"></div>';
      (s.pois || []).forEach(function (p) {
        if (!isFinite(parseFloat(p.lat)) || !isFinite(parseFloat(p.lng))) return;
        var el2 = document.createElement('div');
        el2.className = 'poi-pill';
        el2.innerHTML = '<i style="background:' + esc(p.color || '#64748b') + '"></i>' + esc(p.name);
        new ml.Marker({ element: el2, anchor: 'left' }).setLngLat([parseFloat(p.lng), parseFloat(p.lat)]).addTo(map);
      });
      new ml.Marker({ element: pin, anchor: 'bottom' }).setLngLat([lng, lat]).addTo(map);
      setTimeout(function () { map.resize(); }, 120);
    }).catch(fallback);
  }

  /* Contacto */
  function renderContact(s) {

  /* ---------- Pisos: se empieza en la terraza y se va bajando ---------- */
  var floors = [];
  var floorIdx = -1;
  var floorsScene = null;
  var pendingUnit = null;
  var selUnit = null;
  var imgNat = {};
  var floorStage = $('floorStage');
  var STATUS_COLOR = { disponible: '#22c55e', reservada: '#f5b301', vendida: '#ef4444' };
  var STATUS_LABEL = { disponible: 'Disponible', reservada: 'Reservada', vendida: 'Vendida' };

  function floorsOf(s) { return (s.floors || []).filter(function (f) { return f && f.image; }); }

  function levelKey(v) {
    var l = String(v == null ? '' : v).toLowerCase().trim();
    if (l === '0' || l === 'pb' || l === 'planta baja') return 'pb';
    return l.replace(/^piso\s*/, '');
  }
  function levelText(f) {
    var k = levelKey(f.level);
    if (k === 'pb') return 'Planta baja';
    if (/^\d+$/.test(k)) return k + '°';
    return f.label || k;
  }

  // Unidades cargadas en la seccion "Unidades" con el mismo piso (forma vieja de configurarlo).
  function legacyUnits(f) {
    var want = levelKey(f.level);
    var out = [];
    scenes.forEach(function (sc) {
      if (sc.type !== 'units') return;
      (sc.units || []).forEach(function (u) { if (want && levelKey(u.level) === want) out.push(u); });
    });
    return out;
  }
  function unitsOf(f) { return (f.units && f.units.length) ? f.units : legacyUnits(f); }

  function buildFloorNav() {
    var list = $('fList');
    list.innerHTML = floors.map(function (f, i) {
      return '<button type="button" data-i="' + i + '">' + esc(f.short || f.label) + '</button>';
    }).join('');
    Array.prototype.forEach.call(list.querySelectorAll('button'), function (b) {
      b.addEventListener('click', function () { selectFloor(Number(b.getAttribute('data-i'))); });
    });
  }

  /* La planta ocupa la pantalla como "cover" (o "contain" en pantallas verticales, para que se vean todas las unidades);
     los puntos y las zonas se ubican en % sobre la imagen, así que se calcula el rectángulo real que ocupa. */
  function fitMode() { return window.innerWidth / window.innerHeight < 0.9 ? 'contain' : 'cover'; }

  function layoutStage() {
    var f = floors[floorIdx];
    var n = f && imgNat[f.image];
    if (!n) return;
    var vw = window.innerWidth, vh = window.innerHeight, fit = fitMode();
    var sc = fit === 'cover' ? Math.max(vw / n.w, vh / n.h) : Math.min(vw / n.w, vh / n.h);
    var w = n.w * sc, h = n.h * sc;
    floorStage.style.left = ((vw - w) / 2) + 'px';
    floorStage.style.top = ((vh - h) / 2) + 'px';
    floorStage.style.width = w + 'px';
    floorStage.style.height = h + 'px';
    var im = layers[active] && layers[active].querySelector('img');
    if (im) im.style.objectFit = fit;
  }
  window.addEventListener('resize', function () { if (document.body.classList.contains('in-floors')) layoutStage(); });

  function withDims(src, cb) {
    if (imgNat[src]) { cb(); return; }
    var im = new Image();
    im.onload = function () { imgNat[src] = { w: im.naturalWidth || 1600, h: im.naturalHeight || 1000 }; cb(); };
    im.onerror = function () { cb(); };
    im.src = src;
  }

  function renderStage(f) {
    var svg = '<svg viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true">';
    var pins = '';
    (f.units || []).forEach(function (u) {
      if (!u) return;
      var col = STATUS_COLOR[u.status || 'disponible'] || STATUS_COLOR.disponible;
      if (u.poly && u.poly.length > 2) {
        svg += '<polygon class="zone" data-u="' + esc(u.id) + '" style="--c:' + col + '" points="' +
          u.poly.map(function (p) { return (p[0] * 1000).toFixed(1) + ',' + (p[1] * 1000).toFixed(1); }).join(' ') + '"/>';
      }
      if (typeof u.x === 'number' && typeof u.y === 'number') {
        pins += '<button type="button" class="pin" data-u="' + esc(u.id) + '" style="left:' + (u.x * 100).toFixed(2) + '%;top:' + (u.y * 100).toFixed(2) +
          '%;--c:' + col + '"><i></i><span>' + esc(u.code || '') + '</span></button>';
      }
    });
    floorStage.innerHTML = svg + '</svg>' + pins;
    Array.prototype.forEach.call(floorStage.querySelectorAll('[data-u]'), function (el) {
      el.addEventListener('click', function () { selectUnit(el.getAttribute('data-u')); });
    });
    markSelected();
  }

  function markSelected() {
    Array.prototype.forEach.call(floorStage.querySelectorAll('[data-u]'), function (el) {
      el.classList.toggle('sel', el.getAttribute('data-u') === selUnit);
    });
  }

  function selectFloor(i, force) {
    if (i < 0 || i >= floors.length) return;
    var dir = floorIdx < 0 ? 0 : (i > floorIdx ? 1 : (i < floorIdx ? -1 : 0));
    if (i === floorIdx && !force) return;
    floorIdx = i;
    var f = floors[i];
    closeCard();
    floorStage.classList.add('swap');
    setBackground({ image: f.image, fit: fitMode() }, dir);
    withDims(f.image, function () {
      if (floors[floorIdx] !== f) return;
      layoutStage();
      renderStage(f);
      requestAnimationFrame(function () { floorStage.classList.remove('swap'); });
    });
    Array.prototype.forEach.call($('fList').children, function (b, k) {
      b.classList.toggle('on', k === i);
      if (k === i) b.scrollIntoView({ block: 'nearest' });
    });
    $('fUp').disabled = i === 0;
    $('fDown').disabled = i === floors.length - 1;
    renderFloorInfo(f);
  }

  /* Cuadro de abajo a la izquierda: "Unidades" del piso que se está viendo (se abre para ver la lista) */
  function renderFloorInfo(f) {
    var us = (f.units || []).filter(function (u) { return u && u.id; });
    var count = unitsOf(f);
    var free = count.filter(function (u) { return (u.status || 'disponible') === 'disponible'; }).length;
    var sub = esc(f.label) + (count.length ? ' · ' + free + ' disponible' + (free === 1 ? '' : 's') + ' de ' + count.length : '');
    var box = $('floorInfo');
    box.classList.remove('open');
    box.classList.toggle('has-list', us.length > 0);
    box.innerHTML = '<button type="button" class="fi-head" id="fiHead"' + (us.length ? '' : ' tabindex="-1"') + '><span class="fi-t"><strong>Unidades</strong><span class="fi-sub">' + sub + '</span></span>' +
      (us.length ? '<span class="fi-chev" aria-hidden="true">&#x25B4;</span>' : '') + '</button>' +
      (us.length ? '<div class="fi-list" id="fiList">' + us.map(function (u) {
        var st = u.status || 'disponible';
        var meta = [has(u.area) ? u.area + ' m²' : '', has(u.bedrooms) ? (Number(u.bedrooms) === 0 ? 'Mono.' : u.bedrooms + ' dorm.') : ''].filter(Boolean).join(' · ');
        return '<button type="button" class="fi-row" data-u="' + esc(u.id) + '"><i style="background:' + (STATUS_COLOR[st] || STATUS_COLOR.disponible) + '"></i><b>' + esc(u.code || UNIT) + '</b><span>' + esc(meta) + '</span><em>' + esc(STATUS_LABEL[st] || st) + '</em></button>';
      }).join('') + '</div>' +
      '<div class="lg"><span style="--c:' + STATUS_COLOR.disponible + '">Disponible</span><span style="--c:' + STATUS_COLOR.reservada + '">Reservado</span><span style="--c:' + STATUS_COLOR.vendida + '">Vendido</span></div>' : '');
    if (us.length) {
      $('fiHead').addEventListener('click', function () { box.classList.toggle('open'); });
      Array.prototype.forEach.call(box.querySelectorAll('.fi-row'), function (b) {
        b.addEventListener('click', function () { box.classList.remove('open'); selectUnit(b.getAttribute('data-u')); });
      });
    }
  }

  function enterFloors(s) {
    floorsScene = s;
    floors = floorsOf(s).map(function (f) { return f; });
    floorIdx = -1;
    buildFloorNav();
    document.body.classList.add('in-floors');
    var want = pendingUnit;
    pendingUnit = null;
    selectFloor(want && want.fi >= 0 && want.fi < floors.length ? want.fi : 0, true);
    if (want) {
      var f = floors[floorIdx];
      withDims(f.image, function () { if (floors[floorIdx] === f) selectUnit(want.id); });
    }
  }

  function stepFloor(d) {
    if (!document.body.classList.contains('in-floors') || $('lb').classList.contains('on') || $('tour').classList.contains('on')) return;
    selectFloor(Math.max(0, Math.min(floors.length - 1, floorIdx + d)));
  }
  $('fUp').addEventListener('click', function () { stepFloor(-1); });
  $('fDown').addEventListener('click', function () { stepFloor(1); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { stepFloor(1); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { stepFloor(-1); e.preventDefault(); }
  });
  var wheelLock = 0;
  window.addEventListener('wheel', function (e) {
    if (!document.body.classList.contains('in-floors')) return;
    if (e.target.closest && e.target.closest('#unitCard, #tour')) return;
    if (document.body.classList.contains('menu-open') || $('lb').classList.contains('on') || Math.abs(e.deltaY) < 20 || Date.now() - wheelLock < 650) return;
    wheelLock = Date.now();
    stepFloor(e.deltaY > 0 ? 1 : -1);
  }, { passive: true });

  /* ---------- Ficha de la unidad (a la izquierda) ---------- */
  var card = $('unitCard');
  var cardImg = 0;

  function findUnit(id) {
    var f = floors[floorIdx];
    var list = f ? (f.units || []) : [];
    for (var i = 0; i < list.length; i++) if (String(list[i].id) === String(id)) return list[i];
    return null;
  }

  function selectUnit(id) {
    var u = findUnit(id);
    if (!u) return;
    selUnit = String(id);
    markSelected();
    openCard(u, floors[floorIdx]);
  }

  function closeCard() {
    selUnit = null;
    card.hidden = true;
    card.innerHTML = '';
    document.body.classList.remove('card-open');
    markSelected();
  }

  function has(v) { return v !== '' && v != null; }

  function openCard(u, f) {
    var st = u.status || 'disponible';
    var col = STATUS_COLOR[st] || STATUS_COLOR.disponible;
    var imgs = (u.images || []).filter(Boolean);
    var tours = (u.tour || []).filter(function (t) { return t && t.src; });
    var rows = [];
    if (has(u.area)) rows.push(['Superficie total', esc(u.area) + ' m²']);
    if (has(u.bedrooms)) rows.push(['Dormitorios', Number(u.bedrooms) === 0 ? 'Monoambiente' : esc(u.bedrooms)]);
    if (has(u.bathrooms)) rows.push(['Baños', esc(u.bathrooms)]);
    rows.push(['Piso', esc(levelText(f))]);
    var link = waLink('Hola, me interesa: ' + UNIT + ' ' + (u.code || '') + ' (' + levelText(f) + ') de ' + (C.name || '') + '.');
    cardImg = 0;

    card.innerHTML =
      '<button type="button" class="pill round uc-x" id="ucX" aria-label="Cerrar">&#x2715;</button>' +
      (imgs.length ? '<div class="uc-gal"><img id="ucImg" alt="" src="' + esc(imgs[0]) + '">' +
        (imgs.length > 1 ? '<button type="button" class="uc-nav prev" id="ucPrev" aria-label="Anterior">&#x2039;</button><button type="button" class="uc-nav next" id="ucNext" aria-label="Siguiente">&#x203A;</button>' +
          '<span class="uc-dots" id="ucDots">' + imgs.map(function (x, k) { return '<i' + (k === 0 ? ' class="on"' : '') + '></i>'; }).join('') + '</span>' : '') + '</div>' : '') +
      '<div class="uc-body">' +
        '<div class="uc-head"><h3>' + esc(UNIT) + ' ' + esc(u.code || '') + '</h3><span class="uc-st">' + esc(STATUS_LABEL[st] || st) + '</span></div>' +
        '<div class="uc-price">' + priceText(u) + '</div>' +
        (link && st !== 'vendida' ? '<a class="btn primary uc-cta" target="_blank" rel="noopener" href="' + link + '">Solicitar información</a>' : '') +
        '<dl class="uc-rows">' + rows.map(function (r) { return '<div><dt>' + r[0] + '</dt><dd>' + r[1] + '</dd></div>'; }).join('') + '</dl>' +
        (tours.length ? '<button type="button" class="btn uc-tour" id="ucTour"><span aria-hidden="true">&#x27F3;</span> Tour 360°</button>' : '') +
      '</div>';

    $('ucX').addEventListener('click', closeCard);
    if (imgs.length) {
      var show = function (d) {

      };

        $('ucNext').addEventListener('click', function () { show(1); });

      });

    if (tours.length) $('ucTour').addEventListener('click', function () { openTour(u, tours); });
  }

  /* ---------- Tour 360° (renders equirectangulares, se mira arrastrando) ---------- */
  var tourEl = $('tour');
  var tourCv = $('tourCv');
  var T = { list: [], i: 0, gl: null, prog: null, tex: null, loc: {}, yaw: 0, pitch: 0, fov: 1.35, raf: 0, auto: true, ptrs: {}, pinch: 0, token: 0, ready: false, gl2: false };

  var VS = 'attribute vec2 p; varying vec2 v; void main(){ v = p; gl_Position = vec4(p, 0.0, 1.0); }';
  var FS = '#ifdef GL_FRAGMENT_PRECISION_HIGH\nprecision highp float;\n#else\nprecision mediump float;\n#endif\n' +
    'varying vec2 v; uniform sampler2D t; uniform float yaw; uniform float pitch; uniform float fov; uniform float aspect;\n' +
    'void main(){\n' +
    '  float tf = tan(fov * 0.5);\n' +
    '  vec3 d = normalize(vec3(v.x * aspect * tf, v.y * tf, -1.0));\n' +
    '  float cp = cos(pitch), sp = sin(pitch);\n' +
    '  d = vec3(d.x, d.y * cp - d.z * sp, d.y * sp + d.z * cp);\n' +
    '  float cy = cos(yaw), sy = sin(yaw);\n' +
    '  d = vec3(d.x * cy + d.z * sy, d.y, -d.x * sy + d.z * cy);\n' +
    '  float lon = atan(d.x, -d.z);\n' +
    '  float lat = asin(clamp(d.y, -1.0, 1.0));\n' +
    '  gl_FragColor = texture2D(t, vec2(lon / 6.2831853 + 0.5, 0.5 - lat / 3.1415927));\n' +
    '}';

  function tourMsg(t) { var m = $('tourMsg'); m.textContent = t || ''; m.hidden = !t; }

  function tourInitGL() {
    if (T.gl) return true;
    var gl = tourCv.getContext('webgl2') || tourCv.getContext('webgl') || tourCv.getContext('experimental-webgl');
    if (!gl) return false;
    function sh(type, src) {
      var s = gl.createShader(type);
      gl.shaderSource(s, src); gl.compileShader(s);
      return gl.getShaderParameter(s, gl.COMPILE_STATUS) ? s : null;
    }
    var vs = sh(gl.VERTEX_SHADER, VS), fs = sh(gl.FRAGMENT_SHADER, FS);
    if (!vs || !fs) return false;
    var pr = gl.createProgram();
    gl.attachShader(pr, vs); gl.attachShader(pr, fs); gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) return false;
    gl.useProgram(pr);
    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    var a = gl.getAttribLocation(pr, 'p');
    gl.enableVertexAttribArray(a);
    gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
    ['yaw', 'pitch', 'fov', 'aspect', 't'].forEach(function (n) { T.loc[n] = gl.getUniformLocation(pr, n); });
    T.gl = gl; T.prog = pr;
    T.gl2 = typeof WebGL2RenderingContext !== 'undefined' && gl instanceof WebGL2RenderingContext;
    return true;
  }

  function tourLoad(k) {
    var it = T.list[k];
    var tok = ++T.token;
    T.i = k; T.ready = false;
    $('tourCap').textContent = (T.title ? T.title + ' · ' : '') + (it.label || 'Ambiente ' + (k + 1));
    Array.prototype.forEach.call($('tourStrip').children, function (b, n) { b.classList.toggle('on', n === k); });
    tourMsg('Cargando render 360°…');
    var im = new Image();
    im.onerror = function () { if (tok === T.token) tourMsg('No se pudo cargar este render.'); };
    im.onload = function () {
      if (tok !== T.token) return;
      if (!T.gl) { flatShow(it.src); return; }
      var gl = T.gl;
      var src = im;
      var max = gl.getParameter(gl.MAX_TEXTURE_SIZE);
      if (im.width > max) {
        var c = document.createElement('canvas');
        c.width = max; c.height = Math.round(im.height * max / im.width);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        src = c;
      }
      if (T.tex) gl.deleteTexture(T.tex);
      T.tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, T.tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, T.gl2 ? gl.REPEAT : gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      T.ready = true;
      T.yaw = 0; T.pitch = 0; T.auto = true;
      tourMsg('');
    };
    im.src = it.src;
  }

  // Sin WebGL se muestra el render como una imagen ancha que se desplaza con el dedo o el mouse.
  function flatShow(src) {
    tourEl.classList.add('flat');
    $('tourFlat').innerHTML = '<img alt="" src="' + esc(src) + '">';
    tourMsg('');
  }

  function tourFrame() {
    if (!tourEl.classList.contains('on')) { T.raf = 0; return; }
    T.raf = requestAnimationFrame(tourFrame);
    if (!T.gl || !T.ready) return;
    var gl = T.gl;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.round(tourCv.clientWidth * dpr), h = Math.round(tourCv.clientHeight * dpr);
    if (tourCv.width !== w || tourCv.height !== h) { tourCv.width = w; tourCv.height = h; gl.viewport(0, 0, w, h); }
    if (T.auto && !reduce) T.yaw += 0.0011;
    gl.uniform1f(T.loc.yaw, T.yaw);
    gl.uniform1f(T.loc.pitch, T.pitch);
    gl.uniform1f(T.loc.fov, T.fov);
    gl.uniform1f(T.loc.aspect, w / Math.max(h, 1));
    gl.uniform1i(T.loc.t, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  function openTour(u, list) {
    T.list = list; T.title = UNIT + ' ' + (u.code || '');
    tourEl.classList.add('on');
    tourEl.classList.remove('flat');
    $('tourStrip').innerHTML = list.length > 1 ? list.map(function (it, k) {
      return '<button type="button" data-k="' + k + '">' + esc(it.label || 'Ambiente ' + (k + 1)) + '</button>';
    }).join('') : '';
    Array.prototype.forEach.call($('tourStrip').children, function (b) {
      b.addEventListener('click', function () { tourLoad(Number(b.getAttribute('data-k'))); });
    });
    if (!tourInitGL()) tourEl.classList.add('flat');
    tourLoad(0);
    if (!T.raf) T.raf = requestAnimationFrame(tourFrame);
  }

  function closeTour() {
    tourEl.classList.remove('on', 'flat');
    T.token++;
    $('tourFlat').innerHTML = '';
  }
  $('tourClose').addEventListener('click', closeTour);

  tourCv.addEventListener('pointerdown', function (e) {
    T.auto = false;
    T.ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    try { tourCv.setPointerCapture(e.pointerId); } catch (x) { /* sin captura */ }
    T.pinch = 0;
    tourCv.classList.add('grab');
  });
  tourCv.addEventListener('pointermove', function (e) {
    var p = T.ptrs[e.pointerId];
    if (!p) return;
    var ids = Object.keys(T.ptrs);
    if (ids.length === 2) {
      T.ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
      var a = T.ptrs[ids[0]], b = T.ptrs[ids[1]];
      var dist = Math.hypot(a.x - b.x, a.y - b.y);
      if (T.pinch) T.fov = Math.max(0.6, Math.min(1.9, T.fov * (T.pinch / dist)));
      T.pinch = dist;
      return;
    }
    var k = T.fov / Math.max(tourCv.clientHeight, 1);
    T.yaw += (e.clientX - p.x) * k;
    T.pitch = Math.max(-1.45, Math.min(1.45, T.pitch + (e.clientY - p.y) * k));
    T.ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
  });
  function endPtr(e) {
    delete T.ptrs[e.pointerId];
    T.pinch = 0;
    if (!Object.keys(T.ptrs).length) tourCv.classList.remove('grab');
  }
  tourCv.addEventListener('pointerup', endPtr);
  tourCv.addEventListener('pointercancel', endPtr);
  tourCv.addEventListener('wheel', function (e) {
    e.preventDefault();
    T.fov = Math.max(0.6, Math.min(1.9, T.fov * (e.deltaY > 0 ? 1.06 : 0.94)));
  }, { passive: false });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (tourEl.classList.contains('on')) closeTour();
    else if (!card.hidden && !$('lb').classList.contains('on')) closeCard();
  });

  /* ---------- Visor de fotos y videos ---------- */
  var lb = { items: [], i: 0 };

  function openLightbox(items, k) {
    lb.items = items; lb.i = k;
    $('lb').classList.add('on');
    var strip = $('lbStrip');
    strip.innerHTML = items.map(function (it, n) {
      var vid = isVideo(it.src);
      return '<button type="button" data-n="' + n + '"><img alt="" src="' + esc(vid ? poster(it.src) : it.src) + '">' + (vid ? '<span class="vp">&#9654;</span>' : '') + '</button>';
    }).join('');
    Array.prototype.forEach.call(strip.querySelectorAll('button'), function (b) {
      b.addEventListener('click', function () { lb.i = Number(b.getAttribute('data-n')); showLightbox(); });
    });
    showLightbox();
  }
  function showLightbox() {
    var it = lb.items[lb.i];
    var main = $('lbMedia');
    main.innerHTML = '';
    if (isVideo(it.src)) {
      var v = document.createElement('video');
      v.src = it.src; v.controls = true; v.autoplay = true; v.playsInline = true; v.poster = poster(it.src);
      main.appendChild(v);
    } else {
      var im = new Image();
      im.src = it.src; im.alt = it.caption || '';
      main.appendChild(im);
    }
    $('lbCap').textContent = (it.caption ? it.caption + ' · ' : '') + (lb.i + 1) + ' / ' + lb.items.length;
    Array.prototype.forEach.call($('lbStrip').children, function (b, n) {
      b.classList.toggle('on', n === lb.i);
      if (n === lb.i) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
    var multi = lb.items.length > 1;
    $('lbPrev').hidden = !multi;
    $('lbNext').hidden = !multi;
    $('lbStrip').hidden = !multi;
  }
  function stepLightbox(d) {
    lb.i = (lb.i + d + lb.items.length) % lb.items.length;
    showLightbox();
  }
  function closeLightbox() {
    $('lb').classList.remove('on');
    var v = $('lbMedia').querySelector('video');
    if (v) v.pause();
    $('lbMedia').innerHTML = '';
  }
  $('lbClose').addEventListener('click', closeLightbox);
  $('lbPrev').addEventListener('click', function () { stepLightbox(-1); });
  $('lbNext').addEventListener('click', function () { stepLightbox(1); });
  document.addEventListener('keydown', function (e) {
    if (!$('lb').classList.contains('on')) return;
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowRight') stepLightbox(1);
    else if (e.key === 'ArrowLeft') stepLightbox(-1);
  });

  /* ---------- Arranque ---------- */
  function initIntro() {
    var h = '';
    if (C.logo) h += '<img class="logo" alt="' + esc(C.name || '') + '" src="' + esc(C.logo) + '">';
    h += '<h1>' + esc(intro.title || C.name || '') + '</h1>';
    var sub = intro.subtitle || C.tagline;
    if (sub) h += '<p>' + esc(sub) + '</p>';
    if (scenes.length) h += '<button id="enter" type="button">' + esc(intro.button || 'Ingresar') + '</button>';
    introEl.innerHTML = h;
    var enter = $('enter');
    if (enter) enter.addEventListener('click', function () { go(scenes[0].id, { video: intro.enterVideo }); });
  }

  function initTopbar() {
    $('brand').innerHTML = (C.logo ? '<img alt="" src="' + esc(C.logo) + '">' : '') + (C.logo ? '' : '<span>' + esc(C.name || '') + '</span>');
    $('brand').addEventListener('click', function () { go('inicio'); });
    var link = waLink('Hola, quiero más información sobre ' + (C.name || 'el proyecto') + '.');
    var wa = $('waBtn');
    if (link) wa.href = link; else wa.hidden = true;
    var fs = $('fsBtn');
    if (!document.documentElement.requestFullscreen && !document.documentElement.webkitRequestFullscreen) fs.hidden = true;
    var fsLabel = fs.querySelector('.lbl');
    function fsElement() { return document.fullscreenElement || document.webkitFullscreenElement; }
    function fsText() { fsLabel.textContent = fsElement() ? 'Salir de pantalla completa' : 'Pantalla completa'; }
    fsText();
    document.addEventListener('fullscreenchange', fsText);
    document.addEventListener('webkitfullscreenchange', fsText);

    var noteTimer = 0;
    function fsNote(text) {
      var n = $('fsNote');
      n.textContent = text;
      n.classList.add('on');
      clearTimeout(noteTimer);
      noteTimer = setTimeout(function () { n.classList.remove('on'); }, 6000);
    }
    // Algunos navegadores (y los visores embebidos) no dejan activar la pantalla completa desde la página: en ese caso se avisa.
    function fsFail() {
      if (fsElement() || $('fsNote').classList.contains('on')) return;
      if (window.self !== window.top) {
        var w = window.open(location.href, '_blank');
        if (w) return;
      }
      fsNote('Este navegador no permite la pantalla completa desde la página. Probá con la tecla F11 o abrí el link en Chrome.');
    }
    fs.addEventListener('click', function () {
      var el = document.documentElement;
      if (fsElement()) {
        if (document.exitFullscreen) document.exitFullscreen(); else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        return;
      }
      try {
        var p = el.requestFullscreen ? el.requestFullscreen() : (el.webkitRequestFullscreen ? el.webkitRequestFullscreen() : null);
        if (p && p.catch) p.catch(fsFail);
        else if (!p) fsFail();
        // en algunos visores embebidos la solicitud queda pendiente sin responder: si no pasó a pantalla completa, se avisa
        setTimeout(function () { if (!fsElement()) fsFail(); }, 1200);
      } catch (e) { fsFail(); }
    });
  }

  buildMenu();
  initIntro();
  initTopbar();

  var start = (location.hash || '').replace(/^#\/?/, '');
  var startId = idOfKey[start] || (byId[start] ? start : '');
  if (startId) {
    go(startId, { instant: true });
  } else {
    showIntro();
  }
})();
</script>
</body>
</html>
