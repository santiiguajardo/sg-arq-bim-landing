  /* ---------- Contenido de cada seccion ---------- */
  function head(s) {
    return '<p class="eyebrow">' + esc(C.name || '') + '</p><h2>' + esc(s.title || '') + '</h2>' +
      (s.description ? '<p class="desc">' + esc(s.description) + '</p>' : '');
  }

  function renderScene(s) {
    var html;
    document.body.classList.remove('in-floors');
    closeCard();
    if (s.type === 'floors' && floorsOf(s).length) {
      panel.innerHTML = '';
      enterFloors(s);
      return;
    }
    if (s.type === 'floors') html = head(s) + '<p class="empty">Las plantas de los pisos se están preparando.</p>';
    else if (s.type === 'units') html = renderUnits(s);
    else if (s.type === 'location') html = renderLocation(s);
    else if (s.type === 'contact') html = renderContact(s);
    else if (s.type === 'progress') { progState.stage = null; html = renderProgress(s); }
    else html = renderGallery(s);
    panel.innerHTML = '<div class="card" id="card">' + html + '</div>';
    if (s.type === 'units') wireUnits(s);
    else if (s.type === 'contact') wireContact();
    else if (s.type === 'location') wireLocation(s);
    else if (s.type === 'gallery') wireGallery(s);
    else if (s.type === 'progress') wireProgress(s);
    var box = $('card');
    if (box) box.scrollTop = 0;
  }

  /* Avance de obra: torta con un sector por rubro (el tamaño es su peso en la obra y se llena según lo avanzado).
     Al tocar un sector o su fila se abre el detalle del rubro: tareas, comentario y fotos con fecha. */
  var PCOLORS = ['#5b8def', '#3ec1b3', '#e6a23c', '#c06bd6', '#7fb069', '#e5707e', '#8d99ae', '#4db6e8', '#f08a4b', '#a3a847'];
  var progState = { stage: null };

  function pStages(s) { return ((s.progress && s.progress.stages) || []).filter(function (t) { return t && t.name; }); }
  function pPct(st) {
    var it = st.items || [];
    return it.length ? it.reduce(function (a, i) { return a + (Number(i.percent) || 0); }, 0) / it.length : Number(st.percent) || 0;
  }
  function pOverall(stages) {
    var tw = 0, tp = 0;
    stages.forEach(function (st) { var w = Number(st.weight) || 0; tw += w; tp += w * pPct(st); });
    return tw ? tp / tw : 0;
  }
  function pDate(d) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || '');
    return m ? m[3] + '/' + m[2] + '/' + m[1] : '';
  }
  // fotos de todos los rubros, las más nuevas primero
  function progPhotos(s) {
    var out = [];
    pStages(s).forEach(function (st) {
      (st.photos || []).forEach(function (p) { if (p && p.src) out.push({ src: p.src, date: p.date || '', caption: p.caption || '', stage: st.name }); });
    });
    out.sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
    return out;
  }
  function photoItems(list) {
    return list.map(function (p) {
      return { src: p.src, caption: [pDate(p.date), p.stage, p.caption].filter(Boolean).join(' · ') };
    });
  }

  function donutHtml(stages) {
    var tw = stages.reduce(function (a, st) { return a + (Number(st.weight) || 0); }, 0) || 1;
    var R = 40, C = 50, acc = 0;
    function pt(deg, r) { return [C + r * Math.sin(deg * Math.PI / 180), C - r * Math.cos(deg * Math.PI / 180)]; }
    function arc(a0, a1) {
      var p0 = pt(a0, R), p1 = pt(a1, R);
      return 'M' + p0[0].toFixed(2) + ' ' + p0[1].toFixed(2) + ' A' + R + ' ' + R + ' 0 ' + (a1 - a0 > 180 ? 1 : 0) + ' 1 ' + p1[0].toFixed(2) + ' ' + p1[1].toFixed(2);
    }
    var segs = stages.map(function (st, i) {
      var span = (Number(st.weight) || 0) / tw * 360;
      var gap = stages.length > 1 ? Math.min(2, span / 3) : 0;
      var a0 = acc + gap / 2, a1 = acc + span - gap / 2;
      acc += span;
      var col = PCOLORS[i % PCOLORS.length];
      var pct = Math.min(100, pPct(st));
      var fill = a0 + (a1 - a0) * pct / 100;
      var d = arc(a0, Math.max(a0 + 0.01, a1 - 0.01));
      return '<g class="pg-seg" data-st="' + esc(st.id) + '" tabindex="0" role="button" aria-label="' + esc(st.name + ': ' + Math.round(pct) + '%') + '" style="color:' + col + '">' +
        '<path class="hit" d="' + d + '"/><path class="t" d="' + d + '"/>' +
        (fill > a0 + 0.05 ? '<path class="f" d="' + arc(a0, fill) + '"/>' : '') + '</g>';
    }).join('');
    return '<svg class="pg-donut" viewBox="0 0 100 100" role="group" aria-label="Avance de obra por rubro">' + segs +
      '<text x="50" y="52" text-anchor="middle" class="pg-n">' + Math.round(pOverall(stages)) + '%</text>' +
      '<text x="50" y="62" text-anchor="middle" class="pg-l">de avance</text></svg>';
  }

  function renderProgress(s) {
    var stages = pStages(s);
    var html = head(s);
    if (!stages.length) return html + '<p class="empty">El avance de obra se va a mostrar acá muy pronto.</p>';
    var up = s.progress && s.progress.updatedAt ? pDate(String(s.progress.updatedAt).slice(0, 10)) : '';
    html += '<div class="pg-wrap">' + donutHtml(stages) + '</div>';
    html += '<p class="pg-up">Tocá un rubro para ver el detalle' + (up ? ' · actualizado el ' + esc(up) : '') + '</p>';
    html += '<ul class="pg-leg">' + stages.map(function (st, i) {
      var pct = Math.round(pPct(st));
      return '<li><button type="button" data-st="' + esc(st.id) + '" style="--pc:' + PCOLORS[i % PCOLORS.length] + '"><i></i><span class="n">' + esc(st.name) + '</span><b>' + pct + '%</b>' +
        '<span class="pg-bar"><u style="width:' + pct + '%"></u></span></button></li>';
    }).join('') + '</ul>';
    if (s.progress && s.progress.note) html += '<p class="desc" style="margin-top:12px;">' + esc(s.progress.note) + '</p>';
    var ph = progPhotos(s).slice(0, 6);
    if (ph.length) {
      html += '<h3 class="pg-h3">Últimas fotos de la obra</h3><div class="gal">' + ph.map(function (p, k) {
        return '<button type="button" data-pk="' + k + '" aria-label="' + esc([pDate(p.date), p.stage].filter(Boolean).join(' · ') || 'Foto de obra') + '"><img loading="lazy" alt="" src="' + esc(p.src) + '"></button>';
      }).join('') + '</div>';
    }
    return html;
  }

  function renderProgressDetail(s, id) {
    var stages = pStages(s);
    var idx = -1;
    stages.forEach(function (st, i) { if (st.id === id) idx = i; });
    if (idx < 0) return renderProgress(s);
    var st = stages[idx];
    var pct = Math.round(pPct(st));
    var tw = stages.reduce(function (a, x) { return a + (Number(x.weight) || 0); }, 0) || 1;
    var col = PCOLORS[idx % PCOLORS.length];
    var html = '<button type="button" class="pg-back" data-back>&#x2190; Avance de obra</button>' +
      '<p class="eyebrow">' + esc(C.name || '') + '</p><h2>' + esc(st.name) + '</h2>' +
      '<div class="pg-big" style="--pc:' + col + '"><b>' + pct + '%</b><span>completado · pesa el ' + Math.round((Number(st.weight) || 0) / tw * 100) + '% de la obra</span></div>' +
      '<div class="pg-bar lg" style="--pc:' + col + '"><u style="width:' + pct + '%"></u></div>';
    if (st.note) html += '<p class="desc" style="margin-top:12px;">' + esc(st.note) + '</p>';
    var items = st.items || [];
    if (items.length) {
      html += '<h3 class="pg-h3">Tareas</h3><ul class="pg-items">' + items.map(function (it) {
        var p = Math.round(Number(it.percent) || 0);
        return '<li class="' + (p >= 100 ? 'done' : '') + '"><span class="n">' + esc(it.name) + '</span><b>' + p + '%</b><span class="pg-bar" style="--pc:' + col + '"><u style="width:' + p + '%"></u></span></li>';
      }).join('') + '</ul>';
    }
    var photos = (st.photos || []).filter(function (p) { return p && p.src; }).slice().sort(function (a, b) { return String(b.date || '').localeCompare(String(a.date || '')); });
    if (photos.length) {
      html += '<h3 class="pg-h3">Fotos</h3><div class="gal">' + photos.map(function (p, k) {
        return '<button type="button" data-dk="' + k + '" aria-label="' + esc([pDate(p.date), p.caption].filter(Boolean).join(' · ') || 'Foto de obra') + '"><img loading="lazy" alt="" src="' + esc(p.src) + '">' +
          (p.date ? '<span class="pg-date">' + esc(pDate(p.date)) + '</span>' : '') + '</button>';
      }).join('') + '</div>';
    } else if (!items.length) {
      html += '<p class="empty">Todavía no hay detalle ni fotos de este rubro.</p>';
    }
    return html;
  }

  function wireProgress(s) {
    var box = $('card');
    function open(id) {
      progState.stage = id;
      box.innerHTML = id ? renderProgressDetail(s, id) : renderProgress(s);
      wireProgress(s);
      box.scrollTop = 0;
      if (id) track('avance', id);
    }
    Array.prototype.forEach.call(box.querySelectorAll('[data-st]'), function (el) {
      el.addEventListener('click', function () { open(el.getAttribute('data-st')); });
      el.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(el.getAttribute('data-st')); } });
      // pasar el mouse por una fila resalta su sector en la torta (y al revés)
      var id = el.getAttribute('data-st');
      function mark(on) {
        Array.prototype.forEach.call(box.querySelectorAll('.pg-seg'), function (g) { g.classList.toggle('dim', on && g.getAttribute('data-st') !== id); });
      }
      el.addEventListener('mouseenter', function () { mark(true); });
      el.addEventListener('mouseleave', function () { mark(false); });
      el.addEventListener('focus', function () { mark(true); });
      el.addEventListener('blur', function () { mark(false); });
    });
    var back = box.querySelector('[data-back]');
    if (back) back.addEventListener('click', function () { open(null); });
    Array.prototype.forEach.call(box.querySelectorAll('[data-pk]'), function (b) {
      b.addEventListener('click', function () { openLightbox(photoItems(progPhotos(s).slice(0, 6)), Number(b.getAttribute('data-pk'))); });
    });
    Array.prototype.forEach.call(box.querySelectorAll('[data-dk]'), function (b) {
      b.addEventListener('click', function () {
        var st = pStages(s).filter(function (x) { return x.id === progState.stage; })[0];
        var list = ((st && st.photos) || []).filter(function (p) { return p && p.src; }).slice().sort(function (a, b2) { return String(b2.date || '').localeCompare(String(a.date || '')); });
        openLightbox(photoItems(list.map(function (p) { return { src: p.src, date: p.date, caption: p.caption, stage: '' }; })), Number(b.getAttribute('data-dk')));
      });
    });
  }

  /* Galeria */
  function galleryItems(s) { return (s.items || []).filter(function (i) { return i && i.src; }); }

  function renderGallery(s) {
    var items = galleryItems(s);
    var html = head(s);
    if (items.length) {
      html += '<div class="gal">' + items.map(function (it, k) {
        var vid = isVideo(it.src);
        return '<button type="button" data-k="' + k + '" aria-label="' + esc(it.caption || ('Abrir ' + (k + 1))) + '">' +
          '<img loading="lazy" alt="" src="' + esc(vid ? poster(it.src) : it.src) + '">' +
          (vid ? '<span class="vp">&#9654;</span>' : '') + '</button>';
      }).join('') + '</div>';
      html += '<p class="gal-more">' + items.length + (items.length === 1 ? ' foto o video' : ' fotos y videos') + ' · tocá para ampliar</p>';
    }
    return html;
  }
  function wireGallery(s) {
    var items = galleryItems(s);
    Array.prototype.forEach.call(panel.querySelectorAll('.gal button'), function (b) {
      b.addEventListener('click', function () { openLightbox(items, Number(b.getAttribute('data-k'))); });
    });
  }

  /* Unidades */
  var uFilter = { status: 'todas', rooms: 'todas' };

  function priceText(u) {
    if (!(Number(u.price) > 0)) return 'Consultar';
    return esc((u.currency || 'USD') + ' ' + Number(u.price).toLocaleString('es-AR'));
  }

  // La lista de unidades sale de la propia seccion; si no cargó ninguna, junta las que se configuraron piso por piso.
  function unitPool(s) {
    if (s.units && s.units.length) return { list: s.units, agg: false };
    var out = [];
    scenes.forEach(function (fs) {
      if (fs.type !== 'floors') return;
      floorsOf(fs).forEach(function (f, fi) {
        (f.units || []).forEach(function (u) {
          out.push({ code: u.code, levelLabel: levelText(f), area: u.area, rooms: u.bedrooms, price: u.price, currency: u.currency,
            status: u.status, _id: u.id, _fi: fi, _fs: fs.id, _map: typeof u.x === 'number' || (u.poly && u.poly.length > 2) });
        });
      });
    });
    return { list: out, agg: true };
  }

  function renderUnits(s) {
    var pool = unitPool(s);
    var units = pool.list;
    var html = head(s);
    if (!units.length) return html + '<p class="empty">Todavía no hay unidades cargadas.</p>';
    var statuses = ['disponible', 'reservada', 'vendida'].filter(function (st) {
      return units.some(function (u) { return u.status === st; });
    });
    var rooms = [];
    units.forEach(function (u) { if (u.rooms !== '' && u.rooms != null && rooms.indexOf(String(u.rooms)) < 0) rooms.push(String(u.rooms)); });
    rooms.sort(function (a, b) { return Number(a) - Number(b); });
    html += '<div class="chips" id="fStatus">' +
      ['todas'].concat(statuses).map(function (st) {
        return '<button type="button" class="chip' + (uFilter.status === st ? ' on' : '') + '" data-v="' + st + '">' + (st === 'todas' ? 'Todas' : st.charAt(0).toUpperCase() + st.slice(1)) + '</button>';
      }).join('') + '</div>';
    if (rooms.length > 1) {
      html += '<div class="chips" id="fRooms">' +
        ['todas'].concat(rooms).map(function (r) {
          return '<button type="button" class="chip' + (uFilter.rooms === r ? ' on' : '') + '" data-v="' + r + '">' + (r === 'todas' ? 'Cualquier tamaño' : r + (pool.agg ? ' dorm.' : ' amb.')) + '</button>';
        }).join('') + '</div>';
    }
    html += '<div class="units" id="unitList">' + unitCards(s) + '</div>';
    return html;
  }

  function unitCards(s) {
    var pool = unitPool(s);
    var list = pool.list.filter(function (u) {
      return (uFilter.status === 'todas' || u.status === uFilter.status) &&
        (uFilter.rooms === 'todas' || String(u.rooms) === uFilter.rooms);
    });
    if (!list.length) return '<p class="empty">No hay unidades con ese filtro.</p>';
    return list.map(function (u) {
      var lvl = u.levelLabel || (u.level ? 'Piso ' + u.level : '');
      var meta = [lvl, u.area ? u.area + ' m²' : '', u.rooms !== '' && u.rooms != null ? u.rooms + (pool.agg ? ' dorm.' : ' amb.') : ''].filter(Boolean).join(' · ');
      var link = waLink('Hola, me interesa la unidad ' + (u.code || '') + ' de ' + (C.name || '') + '.');
      var st = u.status || 'disponible';
      var see = pool.agg && u._map ? '<button type="button" class="btn sm" data-see="' + esc(u._fs) + '|' + u._fi + '|' + esc(u._id) + '">Ver en planta</button>' : '';
      return '<div class="unit ' + esc(st) + '"><b>' + esc(u.code || 'Unidad') + '</b><span class="price">' + priceText(u) + '</span>' +
        '<span class="meta">' + esc(meta) + '</span>' +
        '<div class="act"><span class="st ' + esc(st) + '">' + esc(st) + '</span><span class="acts">' + see +
        (link && st !== 'vendida' ? '<a class="btn sm primary" target="_blank" rel="noopener" href="' + link + '">Consultar</a>' : '') + '</span></div></div>';
    }).join('');
  }

  function wireUnits(s) {
    function bind(id, key) {
      var box = $(id);
      if (!box) return;
      Array.prototype.forEach.call(box.querySelectorAll('button'), function (b) {
        b.addEventListener('click', function () {
          uFilter[key] = b.getAttribute('data-v');
          Array.prototype.forEach.call(box.querySelectorAll('button'), function (x) { x.classList.toggle('on', x === b); });
          $('unitList').innerHTML = unitCards(s);
        });
      });
    }
    bind('fStatus', 'status');
    bind('fRooms', 'rooms');
    var list = $('unitList');
    if (list) list.addEventListener('click', function (e) {
      var b = e.target.closest && e.target.closest('[data-see]');
      if (!b) return;
      var p = b.getAttribute('data-see').split('|');
      pendingUnit = { fi: Number(p[1]), id: p[2] };
      go(p[0]);
    });
  }

  /* Ubicacion */
  function hasCoords() { return isFinite(parseFloat(contact.lat)) && isFinite(parseFloat(contact.lng)); }

  function renderLocation(s) {
    var html = head(s);
    if (contact.address) html += '<p class="addr">' + esc(contact.address) + '</p>';
    if (hasCoords()) {
      html += '<div class="map lm" id="lmap" role="img" aria-label="Mapa de la ubicación"></div>';
    } else if (contact.address) {
      html += '<iframe class="map" loading="lazy" title="Mapa" src="https://www.google.com/maps?q=' + encodeURIComponent(contact.address) + '&z=16&output=embed"></iframe>';
    }
    var pois = (s.pois || []).filter(function (p) { return p && p.name; });
    if (pois.length) {
      html += pois.map(function (p) { return '<div class="poi"><span>' + (p.color ? '<i class="pd" style="background:' + esc(p.color) + '"></i>' : '') + esc(p.name) + '</span><span>' + esc(p.distance || '') + '</span></div>'; }).join('');
    }
    var dest = hasCoords() ? parseFloat(contact.lat) + ',' + parseFloat(contact.lng) : (contact.address ? encodeURIComponent(contact.address) : '');
    if (dest) {
      html += '<div class="row" style="margin-top:14px"><a class="btn primary" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=' + dest + '">Cómo llegar</a></div>';
    }
    return html;
  }

  /* Mapa real (MapLibre GL + OpenFreeMap, vectorial y sin clave). Si no se puede cargar, queda el mapa embebido. */
  var MAPLIB = 'https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/';
  var mapLibP = null;
  function loadMapLibre() {
    if (window.maplibregl) return Promise.resolve(window.maplibregl);
    if (mapLibP) return mapLibP;
    mapLibP = new Promise(function (ok, fail) {
      var css = document.createElement('link');
      css.rel = 'stylesheet'; css.href = MAPLIB + 'maplibre-gl.css';
      css.integrity = 'sha384-MinO0mNliZ3vwppuPOUnGa+iq619pfMhLVUXfC4LHwSCvF9H+6P/KO4Q7qBOYV5V'; css.crossOrigin = 'anonymous';
      document.head.appendChild(css);
      var sc = document.createElement('script');
      sc.src = MAPLIB + 'maplibre-gl.js';
      sc.integrity = 'sha384-SYKAG6cglRMN0RVvhNeBY0r3FYKNOJtznwA0v7B5Vp9tr31xAHsZC0DqkQ/pZDmj'; sc.crossOrigin = 'anonymous';
      sc.onload = function () { ok(window.maplibregl); };
      sc.onerror = function () { mapLibP = null; fail(new Error('maplibre')); };
      document.head.appendChild(sc);
    });
    return mapLibP;
  }

  function wireLocation(s) {
    var el = $('lmap');
    if (!el) return;
    var lat = parseFloat(contact.lat), lng = parseFloat(contact.lng);
    var styles = { liberty: 1, positron: 1, bright: 1 };
    var style = styles[contact.mapStyle] ? contact.mapStyle : 'liberty';
    function fallback() {
      if (!el.isConnected) return;
      var bbox = [lng - 0.004, lat - 0.003, lng + 0.004, lat + 0.003].join('%2C');
      el.outerHTML = '<iframe class="map" title="Mapa" src="https://www.openstreetmap.org/export/embed.html?bbox=' + bbox + '&layer=mapnik&marker=' + lat + '%2C' + lng + '"></iframe>';
    }
    loadMapLibre().then(function (ml) {
      if (!el.isConnected) return;
      var map = new ml.Map({
        container: el, style: 'https://tiles.openfreemap.org/styles/' + style,
        center: [lng, lat], zoom: Number(contact.zoom) || 16,
        pitch: 0, bearing: 0,
        cooperativeGestures: true, attributionControl: { compact: true }
      });
      map.addControl(new ml.NavigationControl({ visualizePitch: true }), 'top-right');
      var pin = document.createElement('div');
      pin.className = 'mk-wrap';
      pin.innerHTML = '<div class="mk"></div>';
      (s.pois || []).forEach(function (p) {
        if (!isFinite(parseFloat(p.lat)) || !isFinite(parseFloat(p.lng))) return;
        var el2 = document.createElement('div');
        el2.className = 'poi-pill';
        el2.innerHTML = '<i style="background:' + esc(p.color || '#64748b') + '"></i>' + esc(p.name);
        new ml.Marker({ element: el2, anchor: 'left' }).setLngLat([parseFloat(p.lng), parseFloat(p.lat)]).addTo(map);
      });
      new ml.Marker({ element: pin, anchor: 'bottom' }).setLngLat([lng, lat]).addTo(map);
      setTimeout(function () { map.resize(); }, 120);
    }).catch(fallback);
  }

  /* Contacto */
  function renderContact(s) {
    var html = head(s);
    var link = waLink('Hola, quiero más información sobre ' + (C.name || 'el proyecto') + '.');
    html += '<div class="row">';
    if (link) html += '<a class="btn primary" target="_blank" rel="noopener" href="' + link + '">Escribir por WhatsApp</a>';
    if (contact.phone) html += '<a class="btn" href="tel:' + esc(String(contact.phone).replace(/[^\d+]/g, '')) + '">Llamar</a>';
    if (contact.email) html += '<a class="btn" href="mailto:' + esc(contact.email) + '">Email</a>';
    html += '</div>';
    var info = [];
    if (contact.address) info.push(esc(contact.address));
    if (contact.phone) info.push(esc(contact.phone));
    if (contact.email) info.push(esc(contact.email));
    if (info.length) html += '<div class="cinfo">' + info.map(function (i) { return '<span>' + i + '</span>'; }).join('') + '</div>';
    if (waDigits() || leadsOn()) {
      html += '<form class="form" id="cForm"><input name="name" placeholder="Tu nombre" required>' +
        (leadsOn() ? '<input name="contact" placeholder="Tu teléfono o email" required>' : '') +
        '<input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">' +
        '<textarea name="msg" placeholder="¿Qué te gustaría saber?"></textarea>' +
        '<button class="btn primary" type="submit">Enviar consulta</button>' + privacyNote() + '<p class="fmsg" id="cMsg" role="status"></p></form>';
    }
    return html;
  }
  /* Aviso de privacidad bajo los formularios: lleva a la política de la landing (que está dos carpetas más arriba). */
  function privacyNote() {
    return '<p class="fnote">Usamos estos datos solo para responderte. <a href="../../#privacidad" target="_blank" rel="noopener">Política de privacidad</a></p>';
  }
  function wireContact() {
    var f = $('cForm');
    if (!f) return;
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var name = f.elements.name.value.trim();
      var msg = f.elements.msg.value.trim();
      var text = 'Hola, soy ' + name + '. Consulta sobre ' + (C.name || 'el proyecto') + (msg ? ': ' + msg : '.');
      if (!leadsOn()) { window.open(waLink(text), '_blank', 'noopener'); return; }
      var out = $('cMsg');
      var ct = f.elements.contact.value;
      if (!validContact(ct)) { out.textContent = 'Revisá tu teléfono o email.'; return; }
      if (f.elements.website.value) return;                       // trampa para robots
      var btn = f.querySelector('button[type=submit]');
      btn.disabled = true;
      out.textContent = 'Enviando…';
      var p = splitContact(ct);
      sendLead({ name: name, phone: p.phone, email: p.email, message: msg }).then(function () {
        track('consulta', 'general');
        f.reset();
        out.textContent = '¡Gracias! Recibimos tu consulta y te vamos a contactar.';
        btn.disabled = false;
      }).catch(function () {
        out.textContent = 'No pudimos enviarla. Te abrimos WhatsApp para que escribas directo.';
        btn.disabled = false;
        if (waDigits()) window.open(waLink(text), '_blank', 'noopener');
      });
    });
  }

  /* ---------- Pisos: se empieza en la terraza y se va bajando ---------- */
  var floors = [];
  var floorIdx = -1;
  var floorsScene = null;
  var pendingUnit = null;
  var selUnit = null;
  var imgNat = {};
  var floorStage = $('floorStage');
  var STATUS_COLOR = { disponible: '#22c55e', reservada: '#f5b301', vendida: '#ef4444' };
  var STATUS_LABEL = { disponible: 'Disponible', reservada: 'Reservada', vendida: 'Vendida' };
  var COMMON_COLOR = '#38bdf8';      /* espacios comunes (hall, palier, amenities…): no se venden, tienen su propio color */

  function floorsOf(s) { return (s.floors || []).filter(function (f) { return f && f.image; }); }

  function levelKey(v) {
    var l = String(v == null ? '' : v).toLowerCase().trim();
    if (l === '0' || l === 'pb' || l === 'planta baja') return 'pb';
    return l.replace(/^piso\s*/, '');
  }
  function levelText(f) {
    var k = levelKey(f.level);
    if (k === 'pb') return 'Planta baja';
    if (/^\d+$/.test(k)) return k + '°';
    return f.label || k;
  }

  // Unidades cargadas en la seccion "Unidades" con el mismo piso (forma vieja de configurarlo).
  function legacyUnits(f) {
    var want = levelKey(f.level);
    var out = [];
    scenes.forEach(function (sc) {
      if (sc.type !== 'units') return;
      (sc.units || []).forEach(function (u) { if (want && levelKey(u.level) === want) out.push(u); });
    });
    return out;
  }
  function unitsOf(f) { return (f.units && f.units.length) ? f.units : legacyUnits(f); }

  function buildFloorNav() {
    var list = $('fList');
    list.innerHTML = floors.map(function (f, i) {
      return '<button type="button" data-i="' + i + '">' + esc(f.short || f.label) + '</button>';
    }).join('');
    Array.prototype.forEach.call(list.querySelectorAll('button'), function (b) {
      b.addEventListener('click', function () { selectFloor(Number(b.getAttribute('data-i'))); });
    });
  }

  /* La planta ocupa la pantalla como "cover": en una pantalla vertical (celular) la imagen llena el alto y es más ancha que la pantalla,
     así que se recorre deslizando el dedo hacia la izquierda o la derecha (panFrac: 0 = borde izquierdo, 1 = borde derecho).
     Los puntos y las zonas se ubican en % sobre la imagen, así que se calcula el rectángulo real que ocupa y cuánto está corrido. */
  var panFrac = null;
  function fitMode() { return 'cover'; }
  function panMode() { return window.innerWidth / window.innerHeight < 0.9; }

  function stageGeom() {
    var f = floors[floorIdx];
    var n = f && imgNat[f.image];
    if (!n) return null;
    var vw = window.innerWidth, vh = window.innerHeight;
    var sc = Math.max(vw / n.w, vh / n.h);
    return { w: n.w * sc, h: n.h * sc, vw: vw, vh: vh, f: f };
  }

  // arranca mirando donde están las unidades de ese piso (no el borde de la imagen)
  function defaultPan(g) {
    var xs = (g.f.units || []).filter(function (u) { return u && typeof u.x === 'number'; }).map(function (u) { return u.x; });
    var avg = xs.length ? xs.reduce(function (p, q) { return p + q; }, 0) / xs.length : 0.5;
    return Math.max(0, Math.min(1, (avg * g.w - g.vw / 2) / Math.max(g.w - g.vw, 1)));
  }

  function layoutStage() {
    var g = stageGeom();
    if (!g) return;
    var over = panMode() && g.w > g.vw + 2;
    if (over && panFrac == null) panFrac = defaultPan(g);
    var frac = over ? Math.max(0, Math.min(1, panFrac)) : 0.5;
    floorStage.style.left = (over ? -(g.w - g.vw) * frac : (g.vw - g.w) / 2) + 'px';
    floorStage.style.top = ((g.vh - g.h) / 2) + 'px';
    floorStage.style.width = g.w + 'px';
    floorStage.style.height = g.h + 'px';
    layers.forEach(function (l) {
      var im = l.querySelector('img');
      if (im) { im.style.objectFit = 'cover'; im.style.objectPosition = (frac * 100).toFixed(2) + '% 50%'; }
    });
    updatePanHint(over, frac, g);
  }
  window.addEventListener('resize', function () { if (document.body.classList.contains('in-floors')) layoutStage(); });

  var panHint = document.createElement('div');
  panHint.id = 'panHint';
  panHint.innerHTML = '<span class="ph-t"><i></i></span><span class="ph-x">Deslizá para recorrer la planta</span>';
  document.body.appendChild(panHint);
  var panLayer = document.createElement('div');
  panLayer.id = 'floorPan';
  document.body.insertBefore(panLayer, floorStage);

  function updatePanHint(over, frac, g) {
    panHint.classList.toggle('on', !!over);
    if (!over) return;
    var th = panHint.firstChild.firstChild;
    var wPct = Math.max(12, g.vw / g.w * 100);
    th.style.width = wPct + '%';
    th.style.left = ((100 - wPct) * frac) + '%';
  }

  function setPan(frac) {
    panFrac = Math.max(0, Math.min(1, frac));
    layoutStage();
  }

  var panAnim = 0;
  function panTo(frac) {
    cancelAnimationFrame(panAnim);
    var from = panFrac == null ? frac : panFrac, t0 = null;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { setPan(frac); return; }
    function step(ts) {
      if (t0 === null) t0 = ts;
      var t = Math.min(1, (ts - t0) / 420), e = 1 - Math.pow(1 - t, 3);
      setPan(from + (frac - from) * e);
      if (t < 1) panAnim = requestAnimationFrame(step);
    }
    panAnim = requestAnimationFrame(step);
  }

  // al elegir una unidad (desde la lista o un punto) la planta se corre para que quede a la vista
  function panToUnit(u) {
    var g = stageGeom();
    if (!g || !panMode() || g.w <= g.vw + 2 || typeof u.x !== 'number') return;
    var visible = g.vw - (window.innerWidth <= 760 ? 84 : 0);          // el costado derecho lo ocupa la botonera de pisos
    var left = -(g.w - g.vw) * (panFrac == null ? 0.5 : panFrac);
    var px = left + u.x * g.w;
    if (px > 40 && px < visible - 40) return;                           // ya se ve
    panTo((u.x * g.w - visible / 2) / (g.w - g.vw));
  }

  var drag = { id: null, x: 0, f: 0, moved: false, until: 0 };
  window.addEventListener('pointerdown', function (e) {
    if (!document.body.classList.contains('in-floors') || !panMode() || (e.pointerType === 'mouse' && e.button !== 0)) return;
    var t = e.target;
    if (!(t === panLayer || (t.closest && t.closest('#floorStage')))) return;
    var g = stageGeom();
    if (!g || g.w <= g.vw + 2) return;
    cancelAnimationFrame(panAnim);
    drag = { id: e.pointerId, x: e.clientX, f: panFrac == null ? 0.5 : panFrac, moved: false, until: 0 };
  });
  window.addEventListener('pointermove', function (e) {
    if (drag.id !== e.pointerId) return;
    var dx = e.clientX - drag.x;
    if (!drag.moved && Math.abs(dx) < 8) return;
    drag.moved = true;
    panHint.classList.add('used');
    var g = stageGeom();
    if (g) setPan(drag.f - dx / Math.max(g.w - g.vw, 1));
  });
  function endDrag(e) {
    if (drag.id !== e.pointerId) return;
    if (drag.moved) drag.until = Date.now() + 350;       // el dedo que arrastró no tiene que "tocar" una unidad al soltar
    drag.id = null;
  }
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);
  window.addEventListener('click', function (e) {
    if (Date.now() < drag.until) { e.stopPropagation(); e.preventDefault(); drag.until = 0; }
  }, true);
  window.addEventListener('wheel', function (e) {
    if (!document.body.classList.contains('in-floors') || !panMode() || Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
    var g = stageGeom();
    if (g && g.w > g.vw + 2) setPan((panFrac == null ? 0.5 : panFrac) + e.deltaX / (g.w - g.vw));
  }, { passive: true });

  function withDims(src, cb) {
    if (imgNat[src]) { cb(); return; }
    var im = new Image();
    im.onload = function () { imgNat[src] = { w: im.naturalWidth || 1600, h: im.naturalHeight || 1000 }; cb(); };
    im.onerror = function () { cb(); };
    im.src = src;
  }

  function renderStage(f) {
    var svg = '<svg viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true">';
    var pins = '';
    (f.units || []).concat(f.commons || []).forEach(function (u) {
      if (!u) return;
      var col = u.common ? COMMON_COLOR : (STATUS_COLOR[u.status || 'disponible'] || STATUS_COLOR.disponible);
      var hv = hoverVars(u, col);       // color propio de la unidad: aparece al pasar el mouse o tocar (el resto del tiempo se ve el del estado)
      if (u.poly && u.poly.length > 2) {
        svg += '<polygon class="zone' + (u.common ? ' common' : '') + '" data-u="' + esc(u.id) + '" style="--c:' + col + hv + '" points="' +
          u.poly.map(function (p) { return (p[0] * 1000).toFixed(1) + ',' + (p[1] * 1000).toFixed(1); }).join(' ') + '"/>';
      }
      if (typeof u.x === 'number' && typeof u.y === 'number') {
        pins += '<button type="button" class="pin' + (u.common ? ' common' : '') + '" data-u="' + esc(u.id) + '" style="left:' + (u.x * 100).toFixed(2) + '%;top:' + (u.y * 100).toFixed(2) +
          '%;--c:' + col + hv + '"><i></i><span>' + esc(u.code || '') + '</span></button>';
      }
    });
    floorStage.innerHTML = svg + '</svg>' + pins;
    Array.prototype.forEach.call(floorStage.querySelectorAll('[data-u]'), function (el) {
      el.addEventListener('click', function () { selectUnit(el.getAttribute('data-u')); });
      // pasar el mouse por la zona o por su punto resalta las dos cosas juntas
      el.addEventListener('mouseenter', function (ev) { setHover(el.getAttribute('data-u'), true); showTip(el.getAttribute('data-u'), ev); });
      el.addEventListener('mousemove', moveTip);
      el.addEventListener('mouseleave', function () { setHover(el.getAttribute('data-u'), false); hideTip(); });
    });
    markSelected();
  }

  /* Mini ficha al pasar el mouse por una zona, un punto o una fila de la lista: código, estado y datos principales.
     La ficha completa se sigue abriendo al tocar. En pantallas táctiles no hay "pasar el mouse", así que ahí no aparece. */
  var zoneTip = null;
  function tipEl() {
    if (!zoneTip) { zoneTip = document.createElement('div'); zoneTip.id = 'zoneTip'; zoneTip.hidden = true; document.body.appendChild(zoneTip); }
    return zoneTip;
  }
  function showTip(id, ev) {
    if (window.matchMedia && window.matchMedia('(hover: none)').matches) return;
    var u = findUnit(id);
    if (!u) return;
    if (u.common) {
      var tc = tipEl();
      tc.innerHTML = '<div class="zt-h"><i style="background:' + COMMON_COLOR + '"></i><b>' + esc(u.name || '') + '</b><span style="color:' + COMMON_COLOR + '">Espacio común</span></div>';
      tc.hidden = false;
      moveTip(ev);
      return;
    }
    var st = u.status || 'disponible';
    var col = STATUS_COLOR[st] || STATUS_COLOR.disponible;
    var meta = [];
    if (has(u.area)) meta.push(esc(u.area) + ' m²');
    if (has(u.bedrooms)) meta.push(Number(u.bedrooms) === 0 ? 'Mono.' : esc(u.bedrooms) + ' dorm.');
    if (has(u.bathrooms)) meta.push(esc(u.bathrooms) + (Number(u.bathrooms) === 1 ? ' baño' : ' baños'));
    var t = tipEl();
    t.innerHTML = '<div class="zt-h"><i style="background:' + col + '"></i><b>' + esc(UNIT) + ' ' + esc(u.code || '') + '</b><span style="color:' + col + '">' + esc(STATUS_LABEL[st] || st) + '</span></div>' +
      (meta.length ? '<div class="zt-m">' + meta.join(' · ') + '</div>' : '') + '<div class="zt-p">' + priceText(u) + '</div>';
    t.hidden = false;
    moveTip(ev);
  }
  function moveTip(ev) {
    if (!zoneTip || zoneTip.hidden || !ev) return;
    var x = ev.clientX, y = ev.clientY;
    if (x == null) { var r = ev.currentTarget && ev.currentTarget.getBoundingClientRect ? ev.currentTarget.getBoundingClientRect() : null; if (!r) return; x = r.right; y = r.top; }
    var w = zoneTip.offsetWidth, h = zoneTip.offsetHeight;
    var left = x + 16, top = y + 16;
    if (left + w > window.innerWidth - 8) left = x - w - 16;
    if (top + h > window.innerHeight - 8) top = y - h - 16;
    zoneTip.style.left = Math.max(8, left) + 'px';
    zoneTip.style.top = Math.max(8, top) + 'px';
  }
  function hideTip() { if (zoneTip) zoneTip.hidden = true; }

  function setHover(id, on) {
    Array.prototype.forEach.call(floorStage.querySelectorAll('[data-u]'), function (el) {
      if (el.getAttribute('data-u') === id) el.classList.toggle('hov', on);
    });
  }

  /* Variables de color de una unidad: --h (color propio, si lo eligieron) y --hi (tinta legible sobre ese color) */
  function hoverVars(u, fallback) {
    var c = /^#[0-9a-f]{6}$/i.test(String(u.color || '')) ? u.color : null;
    if (!c) return '';
    var r = parseInt(c.slice(1, 3), 16), g = parseInt(c.slice(3, 5), 16), b = parseInt(c.slice(5, 7), 16);
    var lum = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
    return ';--h:' + c + ';--hi:' + (lum > 0.6 ? '#0b0c10' : '#ffffff');
  }

  function markSelected() {
    Array.prototype.forEach.call(floorStage.querySelectorAll('[data-u]'), function (el) {
      el.classList.toggle('sel', el.getAttribute('data-u') === selUnit);
    });
  }

  var stageTimer = null;

  function selectFloor(i, force) {
    if (i < 0 || i >= floors.length) return;
    var dir = floorIdx < 0 ? 0 : (i > floorIdx ? 1 : (i < floorIdx ? -1 : 0));
    if (i === floorIdx && !force) return;
    floorIdx = i;
    var f = floors[i];
    track('piso', f.short || f.label);
    closeCard();
    floorStage.classList.add('swap');
    setBackground({ image: f.image, fit: fitMode(), stack: true }, dir);
    withDims(f.image, function () {
      if (floors[floorIdx] !== f) return;
      layoutStage();
      renderStage(f);
      // las zonas y los puntos del piso nuevo aparecen cuando la planta ya se acomodó (no encima de la que se está yendo)
      clearTimeout(stageTimer);
      stageTimer = setTimeout(function () { floorStage.classList.remove('swap'); }, dir ? SLAB_MS - 100 : 0);
    });
    Array.prototype.forEach.call($('fList').children, function (b, k) {
      b.classList.toggle('on', k === i);
      if (k === i) b.scrollIntoView({ block: 'nearest' });
    });
    $('fUp').disabled = i === 0;
    $('fDown').disabled = i === floors.length - 1;
    renderFloorInfo(f);
  }

  /* Cuadro de abajo a la izquierda: "Unidades" del piso que se está viendo (se abre para ver la lista) */
  function renderFloorInfo(f) {
    var us = (f.units || []).filter(function (u) { return u && u.id; });
    var cs = (f.commons || []).filter(function (c) { return c && c.id; });
    var hasL = us.length + cs.length > 0;
    var count = unitsOf(f);
    var free = count.filter(function (u) { return (u.status || 'disponible') === 'disponible'; }).length;
    var sub = esc(f.label) + (count.length ? ' · ' + free + ' disponible' + (free === 1 ? '' : 's') + ' de ' + count.length : '') +
      (cs.length ? ' · ' + cs.length + (cs.length === 1 ? ' espacio común' : ' espacios comunes') : '');
    var box = $('floorInfo');
    box.classList.remove('open');
    box.classList.toggle('has-list', hasL);
    var legend = (us.length ? '<span style="--c:' + STATUS_COLOR.disponible + '">Disponible</span><span style="--c:' + STATUS_COLOR.reservada + '">Reservado</span><span style="--c:' + STATUS_COLOR.vendida + '">Vendido</span>' : '') +
      (cs.length ? '<span style="--c:' + COMMON_COLOR + '">Espacio común</span>' : '');
    box.innerHTML = '<button type="button" class="fi-head" id="fiHead"' + (hasL ? '' : ' tabindex="-1"') + '><span class="fi-t"><strong>' + (us.length || !cs.length ? 'Unidades' : 'Espacios comunes') + '</strong><span class="fi-sub">' + sub + '</span></span>' +
      (hasL ? '<span class="fi-chev" aria-hidden="true">&#x25B4;</span>' : '') + '</button>' +
      (hasL ? '<div class="fi-list" id="fiList">' + us.map(function (u) {
        var st = u.status || 'disponible';
        var meta = [has(u.area) ? u.area + ' m²' : '', has(u.bedrooms) ? (Number(u.bedrooms) === 0 ? 'Mono.' : u.bedrooms + ' dorm.') : ''].filter(Boolean).join(' · ');
        return '<button type="button" class="fi-row" data-u="' + esc(u.id) + '"><i style="background:' + (STATUS_COLOR[st] || STATUS_COLOR.disponible) + '"></i><b>' + esc(u.code || UNIT) + '</b><span>' + esc(meta) + '</span><em>' + esc(STATUS_LABEL[st] || st) + '</em></button>';
      }).join('') + (cs.length ? (us.length ? '<div class="fi-sec">Espacios comunes</div>' : '') + cs.map(function (c) {
        return '<button type="button" class="fi-row" data-u="' + esc(c.id) + '"><i style="background:' + COMMON_COLOR + '"></i><b>' + esc(c.name || '') + '</b><span></span><em>Común</em></button>';
      }).join('') : '') + '</div><div class="lg">' + legend + '</div>' : '');
    if (hasL) {
      $('fiHead').addEventListener('click', function () { box.classList.toggle('open'); });
      Array.prototype.forEach.call(box.querySelectorAll('.fi-row'), function (b) {
        b.addEventListener('click', function () { box.classList.remove('open'); hideTip(); selectUnit(b.getAttribute('data-u')); });
        // pasar el mouse por una fila muestra la zona de ese departamento sobre la planta
        b.addEventListener('mouseenter', function (ev) { setHover(b.getAttribute('data-u'), true); showTip(b.getAttribute('data-u'), ev); });
        b.addEventListener('mousemove', moveTip);
        b.addEventListener('mouseleave', function () { setHover(b.getAttribute('data-u'), false); hideTip(); });
      });
    }
  }

  function enterFloors(s) {
    floorsScene = s;
    floors = floorsOf(s).map(function (f) { return f; });
    floors.forEach(function (f) { (f.commons || []).forEach(function (c) { if (c) { c.common = true; c.code = c.name || ''; } }); });
    floorIdx = -1;
    panFrac = null;
    buildFloorNav();
    document.body.classList.add('in-floors');
    var want = pendingUnit;
    pendingUnit = null;
    var start = 0;       // piso con el que se abre: el que eligió el dueño en su panel (si no está o no tiene imagen, el primero)
    if (s.startLevel) {
      var sk = levelKey(s.startLevel);
      for (var si = 0; si < floors.length; si++) { if (levelKey(floors[si].level) === sk) { start = si; break; } }
    }
    selectFloor(want && want.fi >= 0 && want.fi < floors.length ? want.fi : start, true);
    if (want) {
      var f = floors[floorIdx];
      withDims(f.image, function () { if (floors[floorIdx] === f) selectUnit(want.id); });
    }
  }

  function stepFloor(d) {
    if (!document.body.classList.contains('in-floors') || $('lb').classList.contains('on') || $('tour').classList.contains('on')) return;
    selectFloor(Math.max(0, Math.min(floors.length - 1, floorIdx + d)));
  }
  $('fUp').addEventListener('click', function () { stepFloor(-1); });
  $('fDown').addEventListener('click', function () { stepFloor(1); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { stepFloor(1); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { stepFloor(-1); e.preventDefault(); }
  });
  var wheelLock = 0;
  window.addEventListener('wheel', function (e) {
    if (!document.body.classList.contains('in-floors')) return;
    if (e.target.closest && e.target.closest('#unitCard, #tour')) return;
    if (document.body.classList.contains('menu-open') || $('lb').classList.contains('on') || Math.abs(e.deltaY) < 20 || Date.now() - wheelLock < 650) return;
    wheelLock = Date.now();
    stepFloor(e.deltaY > 0 ? 1 : -1);
  }, { passive: true });

  /* ---------- Ficha de la unidad (a la izquierda) ---------- */
  var card = $('unitCard');
  var cardImg = 0;

  function findUnit(id) {
    var f = floors[floorIdx];
    var list = f ? (f.units || []).concat(f.commons || []) : [];
    for (var i = 0; i < list.length; i++) if (String(list[i].id) === String(id)) return list[i];
    return null;
  }

  function selectUnit(id) {
    var u = findUnit(id);
    if (!u) return;
    selUnit = String(id);
    track(u.common ? 'comun' : 'depto', u.code);
    markSelected();
    hideTip();
    panToUnit(u);
    openCard(u, floors[floorIdx]);
  }

  function closeCard() {
    selUnit = null;
    card.hidden = true;
    card.innerHTML = '';
    document.body.classList.remove('card-open');
    markSelected();
  }

  function has(v) { return v !== '' && v != null; }

  /* Ficha de la unidad: tarjeta clara con fotos arriba, título y estado, "ver unidades similares", datos con íconos y botones.
     Si la unidad todavía no tiene fotos se muestra un cuadro de "Fotos próximamente" para que la ficha se vea completa igual. */
  var UCI = {
    area: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="8" width="19" height="8" rx="1.5"/><path d="M6.5 8v3M10 8v4M13.5 8v3M17 8v4"/></svg>',
    bed: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.2"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.2"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.2"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.2"/></svg>',
    bath: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18v2.5a4.5 4.5 0 0 1-4.5 4.5h-9A4.5 4.5 0 0 1 3 14.5V12Z"/><path d="M6 12V6.5A2.5 2.5 0 0 1 8.5 4h.5M7 19l-1 2M17 19l1 2"/></svg>',
    floor: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 13 9 5 9-5"/></svg>',
    tag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12.5V4a.5.5 0 0 1 .5-.5h8.5l8 8a1.4 1.4 0 0 1 0 2l-6.5 6.5a1.4 1.4 0 0 1-2 0l-8-8Z"/><circle cx="8" cy="8" r="1.3"/></svg>',
    route: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5.5" r="2.4"/><circle cx="18" cy="18.5" r="2.4"/><path d="M6 8v3.5a3 3 0 0 0 3 3h6a3 3 0 0 1 3 3"/></svg>',
    tour: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/><circle cx="12" cy="12" r="2.2"/></svg>',
    doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>',
    photo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-5-5-8 8"/></svg>'
  };

  function inkFor(hex) {
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255 > 0.55 ? '#10202c' : '#ffffff';
  }

  /* Unidades parecidas (mismos dormitorios, en cualquier piso): primero las disponibles y las de superficie más cercana */
  function similarUnits(u, fi) {
    var out = [];
    floors.forEach(function (fl, k) {
      unitsOf(fl).forEach(function (x) {
        if (!x || String(x.id) === String(u.id)) return;
        if (has(u.bedrooms) && has(x.bedrooms) && Number(u.bedrooms) !== Number(x.bedrooms)) return;
        if (!has(u.bedrooms) && has(x.bedrooms)) return;
        var d = (has(u.area) && has(x.area)) ? Math.abs(Number(u.area) - Number(x.area)) : 999;
        out.push({ u: x, fi: k, f: fl, d: d + (x.status === 'vendida' ? 1000 : 0) + (k === fi ? 0 : 0.1) });
      });
    });
    out.sort(function (a, b) { return a.d - b.d; });
    return out.slice(0, 5);
  }

  function goUnit(fi, id) {
    if (fi !== floorIdx) selectFloor(fi);
    selectUnit(id);
  }

  function openCard(u, f) {
    var com = !!u.common;
    var st = u.status || 'disponible';
    var col = com ? COMMON_COLOR : (STATUS_COLOR[st] || STATUS_COLOR.disponible);
    var imgs = (u.images || []).filter(Boolean);
    var tours = (u.tour || []).filter(function (t) { return t && t.src; });
    var ficha = /^https:\/\//i.test(String(u.fichaUrl || '')) ? String(u.fichaUrl) : '';
    var rows = [];
    rows.push([UCI.tag, 'Precio', priceText(u)]);
    if (has(u.area)) rows.push([UCI.area, 'Superficie total', esc(u.area) + ' m²']);
    if (has(u.bedrooms)) rows.push([UCI.bed, 'Dormitorios', Number(u.bedrooms) === 0 ? 'Monoambiente' : esc(u.bedrooms)]);
    if (has(u.bathrooms)) rows.push([UCI.bath, 'Baños', esc(u.bathrooms)]);
    rows.push([UCI.floor, 'Piso', esc(levelText(f))]);
    if (com) rows = [rows[rows.length - 1]];
    var link = waLink('Hola, me interesa: ' + UNIT + ' ' + (u.code || '') + ' (' + levelText(f) + ') de ' + (C.name || '') + '.');
    var sim = com ? [] : similarUnits(u, floorIdx);
    cardImg = 0;
    card.style.setProperty('--c', col);
    card.style.setProperty('--ink-st', inkFor(col));
    var gal = imgs.length
      ? '<div class="uc-gal"><img id="ucImg" alt="" src="' + esc(imgs[0]) + '">' +
        (imgs.length > 1 ? '<button type="button" class="uc-nav prev" id="ucPrev" aria-label="Anterior">&#x2039;</button><button type="button" class="uc-nav next" id="ucNext" aria-label="Siguiente">&#x203A;</button>' +
          '<span class="uc-dots" id="ucDots">' + imgs.map(function (x, k) { return '<i' + (k === 0 ? ' class="on"' : '') + '></i>'; }).join('') + '</span>' : '') + '</div>'
      : '<div class="uc-gal empty"><div>' + UCI.photo + '<span>Fotos próximamente</span></div></div>';
    // botones: Consultar (si no está vendida), Tour 360° y Ver ficha (si hay link a la ficha técnica)
    var acts = [];
    if (!com && st !== 'vendida') {
      if (leadsOn()) acts.push('<button type="button" class="uc-b pri" id="ucAsk">Consultar</button>');
      else if (link) acts.push('<a class="uc-b pri" target="_blank" rel="noopener" href="' + link + '">Consultar</a>');
    }
    if (tours.length) acts.push('<button type="button" class="uc-b" id="ucTour"><span class="ic" aria-hidden="true">' + UCI.tour + '</span>Tour 360°</button>');
    if (ficha) acts.push('<a class="uc-b' + (acts.length ? '' : ' pri') + '" target="_blank" rel="noopener" href="' + esc(ficha) + '"><span class="ic" aria-hidden="true">' + UCI.doc + '</span>Ver ficha</a>');
    card.innerHTML =
      '<button type="button" class="uc-x" id="ucX" aria-label="Cerrar">&#x2715;</button>' + gal +
      '<div class="uc-body">' +
        '<div class="uc-head"><h3>' + (/^#[0-9a-f]{6}$/i.test(String(u.color || '')) ? '<i class="uc-chip" style="--h:' + u.color + '"></i>' : '') + (com ? esc(u.name || '') : esc(UNIT) + ' ' + esc(u.code || '')) + '</h3><span class="uc-st">' + (com ? 'Espacio común' : esc(STATUS_LABEL[st] || st)) + '</span></div>' +
        (sim.length ? '<button type="button" class="uc-simbtn" id="ucSimBtn" aria-expanded="false"><span class="ic" aria-hidden="true">' + UCI.route + '</span><b>Ver ' + esc(UNIT.toLowerCase()) + 's similares</b><span class="chev" aria-hidden="true">&#x203A;</span></button>' +
          '<div class="uc-sim" id="ucSim" hidden>' + sim.map(function (x, k) {
            var cs = STATUS_COLOR[x.u.status || 'disponible'] || STATUS_COLOR.disponible;
            var meta = [has(x.u.area) ? x.u.area + ' m²' : '', esc(levelText(x.f))].filter(Boolean).join(' · ');
            return '<button type="button" class="uc-simrow" data-k="' + k + '"><i style="background:' + cs + '"></i><b>' + esc(x.u.code || UNIT) + '</b><span>' + meta + '</span><em>' + esc(STATUS_LABEL[x.u.status || 'disponible']) + '</em></button>';
          }).join('') + '</div>' : '') +
        '<dl class="uc-rows">' + rows.map(function (r) { return '<div><dt><span class="ic" aria-hidden="true">' + r[0] + '</span>' + r[1] + '</dt><dd>' + r[2] + '</dd></div>'; }).join('') + '</dl>' +
        (acts.length ? '<div class="uc-acts n' + acts.length + '">' + acts.join('') + '</div>' : '') +
        '<div id="ucAskBox"></div>' +
      '</div>';
    card.hidden = false;
    card.scrollTop = 0;
    document.body.classList.add('card-open');
    $('ucX').addEventListener('click', closeCard);
    if (imgs.length) {
      var show = function (d) {
        cardImg = (cardImg + d + imgs.length) % imgs.length;
        $('ucImg').src = imgs[cardImg];
        Array.prototype.forEach.call($('ucDots').children, function (x, k) { x.classList.toggle('on', k === cardImg); });
      };
      if (imgs.length > 1) {
        $('ucPrev').addEventListener('click', function () { show(-1); });
        $('ucNext').addEventListener('click', function () { show(1); });
      }
      $('ucImg').addEventListener('click', function () {
        openLightbox(imgs.map(function (x) { return { src: x }; }), cardImg);
      });
    }
    if ($('ucSimBtn')) {
      $('ucSimBtn').addEventListener('click', function () {
        var open = $('ucSim').hidden;
        $('ucSim').hidden = !open;
        $('ucSimBtn').classList.toggle('open', open);
        $('ucSimBtn').setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      Array.prototype.forEach.call($('ucSim').querySelectorAll('.uc-simrow'), function (b) {
        b.addEventListener('click', function () { var x = sim[Number(b.getAttribute('data-k'))]; if (x) goUnit(x.fi, x.u.id); });
      });
    }
    if (tours.length) $('ucTour').addEventListener('click', function () { openTour(u, tours); });
    if ($('ucAsk')) $('ucAsk').addEventListener('click', function () { askForm(u, f, link); $('ucAsk').hidden = true; });
  }

  /* Formulario corto dentro de la ficha: la consulta llega a la planilla del dueño con el departamento que se miró */
  function askForm(u, f, link) {
    var box = $('ucAskBox');
    var msg = 'Hola, me interesa: ' + UNIT + ' ' + (u.code || '') + ' (' + levelText(f) + ') de ' + (C.name || '') + '.';
    box.innerHTML = '<form class="uc-form" id="ucForm"><input name="name" placeholder="Tu nombre" required>' +
      '<input name="contact" placeholder="Tu teléfono o email" required>' +
      '<input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">' +
      '<textarea name="message" rows="2">' + esc(msg) + '</textarea>' +
      '<button class="btn primary" type="submit">Enviar consulta</button>' +
      (link ? '<a class="uc-wa" target="_blank" rel="noopener" href="' + link + '">o escribir por WhatsApp</a>' : '') +
      privacyNote() +
      '<p class="fmsg" id="ucMsg" role="status"></p></form>';
    var form = $('ucForm');
    form.elements.name.focus();
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var out = $('ucMsg');
      var ct = form.elements.contact.value;
      if (!validContact(ct)) { out.textContent = 'Revisá tu teléfono o email.'; return; }
      if (form.elements.website.value) return;
      var btn = form.querySelector('button[type=submit]');
      btn.disabled = true;
      out.textContent = 'Enviando…';
      var p = splitContact(ct);
      sendLead({ unit: u.code, floor: levelText(f), name: form.elements.name.value.trim(), phone: p.phone, email: p.email, message: form.elements.message.value.trim() }).then(function () {
        track('consulta', u.code);
        box.innerHTML = '<p class="fmsg ok">¡Gracias! Recibimos tu consulta por el ' + esc(UNIT.toLowerCase()) + ' ' + esc(u.code || '') + ' y te vamos a contactar.</p>';
      }).catch(function () {
        btn.disabled = false;
        out.textContent = 'No pudimos enviarla.' + (link ? ' Probá por WhatsApp.' : ' Probá de nuevo en un rato.');
      });
    });
  }

  /* ---------- Tour 360° (renders equirectangulares, se mira arrastrando) ---------- */
  var tourEl = $('tour');
  var tourCv = $('tourCv');
  var T = { list: [], links: [], i: 0, gl: null, prog: null, tex: null, loc: {}, yaw: 0, pitch: 0, fov: 1.35, raf: 0, auto: true, ptrs: {}, pinch: 0, token: 0, ready: false, gl2: false };

  var VS = 'attribute vec2 p; varying vec2 v; void main(){ v = p; gl_Position = vec4(p, 0.0, 1.0); }';
  var FS = '#ifdef GL_FRAGMENT_PRECISION_HIGH\nprecision highp float;\n#else\nprecision mediump float;\n#endif\n' +
    'varying vec2 v; uniform sampler2D t; uniform float yaw; uniform float pitch; uniform float fov; uniform float aspect;\n' +
    'void main(){\n' +
    '  float tf = tan(fov * 0.5);\n' +
    '  vec3 d = normalize(vec3(v.x * aspect * tf, v.y * tf, -1.0));\n' +
    '  float cp = cos(pitch), sp = sin(pitch);\n' +
    '  d = vec3(d.x, d.y * cp - d.z * sp, d.y * sp + d.z * cp);\n' +
    '  float cy = cos(yaw), sy = sin(yaw);\n' +
    '  d = vec3(d.x * cy + d.z * sy, d.y, -d.x * sy + d.z * cy);\n' +
    '  float lon = atan(d.x, -d.z);\n' +
    '  float lat = asin(clamp(d.y, -1.0, 1.0));\n' +
    '  gl_FragColor = texture2D(t, vec2(lon / 6.2831853 + 0.5, 0.5 - lat / 3.1415927));\n' +
    '}';

  /* Flechas para pasar de un ambiente a otro (como en Street View): cada render puede tener "links" ({ to: id del otro render,
     yaw, pitch } = dirección en la imagen donde está la flecha). Son botones HTML que se reubican en cada cuadro proyectando la
     dirección al mismo punto de vista que usa el shader. */
  var linksEl = document.createElement('div');
  linksEl.id = 'tourLinks';
  tourEl.appendChild(linksEl);
  var ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 15l7-7 7 7"/></svg>';

  function tourIndexById(id) {
    for (var q = 0; q < T.list.length; q++) { if (T.list[q].id === id) return q; }
    return -1;
  }

  function buildLinks(it) {
    T.links = [];
    linksEl.innerHTML = '';
    (it.links || []).forEach(function (l) {
      var to = tourIndexById(l.to);
      if (to < 0 || typeof l.yaw !== 'number' || typeof l.pitch !== 'number') return;
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tlink';
      b.style.opacity = '0';
      var name = T.list[to].label || 'Ambiente ' + (to + 1);
      b.setAttribute('aria-label', 'Ir a ' + name);
      b.innerHTML = '<span class="tl-ar">' + ARROW + '</span><span class="tl-lb">' + esc(name) + '</span>';
      b.addEventListener('click', function (e) { e.stopPropagation(); tourLoad(to, true); });
      linksEl.appendChild(b);
      var cp = Math.cos(l.pitch);
      T.links.push({ el: b, x: Math.sin(l.yaw) * cp, y: Math.sin(l.pitch), z: -Math.cos(l.yaw) * cp });
    });
  }

  function placeLinks(w, h, dpr) {
    var tf = Math.tan(T.fov * 0.5), asp = w / Math.max(h, 1);
    var cp = Math.cos(T.pitch), sp = Math.sin(T.pitch), cy = Math.cos(T.yaw), sy = Math.sin(T.yaw);
    var cw = w / dpr, ch = h / dpr;
    T.links.forEach(function (l) {
      // dirección del mundo -> espacio de la cámara (inversa de las dos rotaciones del shader)
      var x1 = l.x * cy - l.z * sy, z1 = l.x * sy + l.z * cy;
      var dz = -l.y * sp + z1 * cp, dy = l.y * cp + z1 * sp;
      if (dz > -0.05 || !T.ready) { l.el.style.opacity = '0'; l.el.style.pointerEvents = 'none'; return; }
      var nx = x1 / (-dz) / (tf * asp), ny = dy / (-dz) / tf;
      if (Math.abs(nx) > 1.15 || Math.abs(ny) > 1.15) { l.el.style.opacity = '0'; l.el.style.pointerEvents = 'none'; return; }
      l.el.style.left = ((nx * 0.5 + 0.5) * cw).toFixed(1) + 'px';
      l.el.style.top = ((0.5 - ny * 0.5) * ch).toFixed(1) + 'px';
      l.el.style.opacity = '1'; l.el.style.pointerEvents = 'auto';
    });
  }

  function tourMsg(t) { var m = $('tourMsg'); m.textContent = t || ''; m.hidden = !t; }

  function tourInitGL() {
    if (T.gl) return true;
    var gl = tourCv.getContext('webgl2') || tourCv.getContext('webgl') || tourCv.getContext('experimental-webgl');
    if (!gl) return false;
    function sh(type, src) {
      var s = gl.createShader(type);
      gl.shaderSource(s, src); gl.compileShader(s);
      return gl.getShaderParameter(s, gl.COMPILE_STATUS) ? s : null;
    }
    var vs = sh(gl.VERTEX_SHADER, VS), fs = sh(gl.FRAGMENT_SHADER, FS);
    if (!vs || !fs) return false;
    var pr = gl.createProgram();
    gl.attachShader(pr, vs); gl.attachShader(pr, fs); gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) return false;
    gl.useProgram(pr);
    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    var a = gl.getAttribLocation(pr, 'p');
    gl.enableVertexAttribArray(a);
    gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
    ['yaw', 'pitch', 'fov', 'aspect', 't'].forEach(function (n) { T.loc[n] = gl.getUniformLocation(pr, n); });
    T.gl = gl; T.prog = pr;
    T.gl2 = typeof WebGL2RenderingContext !== 'undefined' && gl instanceof WebGL2RenderingContext;
    return true;
  }

  function tourLoad(k, keepView) {
    var it = T.list[k];
    var tok = ++T.token;
    T.i = k; T.ready = false;
    buildLinks(it);
    $('tourCap').textContent = (T.title ? T.title + ' · ' : '') + (it.label || 'Ambiente ' + (k + 1));
    Array.prototype.forEach.call($('tourStrip').children, function (b, n) { b.classList.toggle('on', n === k); });
    tourMsg('Cargando render 360°…');
    var im = new Image();
    im.onerror = function () { if (tok === T.token) tourMsg('No se pudo cargar este render.'); };
    im.onload = function () {
      if (tok !== T.token) return;
      if (!T.gl) { flatShow(it.src); return; }
      var gl = T.gl;
      var src = im;
      var max = gl.getParameter(gl.MAX_TEXTURE_SIZE);
      if (im.width > max) {
        var c = document.createElement('canvas');
        c.width = max; c.height = Math.round(im.height * max / im.width);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        src = c;
      }
      if (T.tex) gl.deleteTexture(T.tex);
      T.tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, T.tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, T.gl2 ? gl.REPEAT : gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      T.ready = true;
      if (!keepView) { T.yaw = 0; T.pitch = 0; T.auto = true; }     // al pasar por una flecha se sigue mirando para el mismo lado
      tourMsg('');
    };
    im.src = it.src;
  }

  // Sin WebGL se muestra el render como una imagen ancha que se desplaza con el dedo o el mouse.
  function flatShow(src) {
    tourEl.classList.add('flat');
    $('tourFlat').innerHTML = '<img alt="" src="' + esc(src) + '">';
    tourMsg('');
  }

  function tourFrame() {
    if (!tourEl.classList.contains('on')) { T.raf = 0; return; }
    T.raf = requestAnimationFrame(tourFrame);
    if (!T.gl || !T.ready) return;
    var gl = T.gl;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.round(tourCv.clientWidth * dpr), h = Math.round(tourCv.clientHeight * dpr);
    if (tourCv.width !== w || tourCv.height !== h) { tourCv.width = w; tourCv.height = h; gl.viewport(0, 0, w, h); }
    if (T.auto && !reduce) T.yaw += 0.0011;
    gl.uniform1f(T.loc.yaw, T.yaw);
    gl.uniform1f(T.loc.pitch, T.pitch);
    gl.uniform1f(T.loc.fov, T.fov);
    gl.uniform1f(T.loc.aspect, w / Math.max(h, 1));
    gl.uniform1i(T.loc.t, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    if (T.links.length) placeLinks(w, h, dpr);
  }

  function openTour(u, list) {
    track('tour', u.code);
    T.list = list; T.title = u.common ? (u.name || '') : UNIT + ' ' + (u.code || '');
    tourEl.classList.add('on');
    tourEl.classList.remove('flat');
    $('tourStrip').innerHTML = list.length > 1 ? list.map(function (it, k) {
      return '<button type="button" data-k="' + k + '">' + esc(it.label || 'Ambiente ' + (k + 1)) + '</button>';
    }).join('') : '';
    Array.prototype.forEach.call($('tourStrip').children, function (b) {
      b.addEventListener('click', function () { tourLoad(Number(b.getAttribute('data-k'))); });
    });
    if (!tourInitGL()) tourEl.classList.add('flat');
    tourLoad(0);
    if (!T.raf) T.raf = requestAnimationFrame(tourFrame);
  }

  function closeTour() {
    tourEl.classList.remove('on', 'flat');
    T.token++;
    T.links = [];
    linksEl.innerHTML = '';
    $('tourFlat').innerHTML = '';
  }
  $('tourClose').addEventListener('click', closeTour);

  tourCv.addEventListener('pointerdown', function (e) {
    T.auto = false;
    T.ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    try { tourCv.setPointerCapture(e.pointerId); } catch (x) { /* sin captura */ }
    T.pinch = 0;
    tourCv.classList.add('grab');
  });
  tourCv.addEventListener('pointermove', function (e) {
    var p = T.ptrs[e.pointerId];
    if (!p) return;
    var ids = Object.keys(T.ptrs);
    if (ids.length === 2) {
      T.ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
      var a = T.ptrs[ids[0]], b = T.ptrs[ids[1]];
      var dist = Math.hypot(a.x - b.x, a.y - b.y);
      if (T.pinch) T.fov = Math.max(0.6, Math.min(1.9, T.fov * (T.pinch / dist)));
      T.pinch = dist;
      return;
    }
    var k = T.fov / Math.max(tourCv.clientHeight, 1);
    T.yaw += (e.clientX - p.x) * k;
    T.pitch = Math.max(-1.45, Math.min(1.45, T.pitch + (e.clientY - p.y) * k));
    T.ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
  });
  function endPtr(e) {
    delete T.ptrs[e.pointerId];
    T.pinch = 0;
    if (!Object.keys(T.ptrs).length) tourCv.classList.remove('grab');
  }
  tourCv.addEventListener('pointerup', endPtr);
  tourCv.addEventListener('pointercancel', endPtr);
  tourCv.addEventListener('wheel', function (e) {
    e.preventDefault();
    T.fov = Math.max(0.6, Math.min(1.9, T.fov * (e.deltaY > 0 ? 1.06 : 0.94)));
  }, { passive: false });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (tourEl.classList.contains('on')) closeTour();
    else if (!card.hidden && !$('lb').classList.contains('on')) closeCard();
  });

  /* ---------- Visor de fotos y videos ---------- */
  var lb = { items: [], i: 0 };

  function openLightbox(items, k) {
    lb.items = items; lb.i = k;
    $('lb').classList.add('on');
    var strip = $('lbStrip');
    strip.innerHTML = items.map(function (it, n) {
      var vid = isVideo(it.src);
      return '<button type="button" data-n="' + n + '"><img alt="" src="' + esc(vid ? poster(it.src) : it.src) + '">' + (vid ? '<span class="vp">&#9654;</span>' : '') + '</button>';
    }).join('');
    Array.prototype.forEach.call(strip.querySelectorAll('button'), function (b) {
      b.addEventListener('click', function () { lb.i = Number(b.getAttribute('data-n')); showLightbox(); });
    });
    showLightbox();
  }
  function showLightbox() {
    var it = lb.items[lb.i];
    var main = $('lbMedia');
    main.innerHTML = '';
    if (isVideo(it.src)) {
      var v = document.createElement('video');
      v.src = it.src; v.controls = true; v.autoplay = true; v.playsInline = true; v.poster = poster(it.src);
      main.appendChild(v);
    } else {
      var im = new Image();
      im.src = it.src; im.alt = it.caption || '';
      main.appendChild(im);
    }
    $('lbCap').textContent = (it.caption ? it.caption + ' · ' : '') + (lb.i + 1) + ' / ' + lb.items.length;
    Array.prototype.forEach.call($('lbStrip').children, function (b, n) {
      b.classList.toggle('on', n === lb.i);
      if (n === lb.i) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
    var multi = lb.items.length > 1;
    $('lbPrev').hidden = !multi;
    $('lbNext').hidden = !multi;
    $('lbStrip').hidden = !multi;
  }
  function stepLightbox(d) {
    lb.i = (lb.i + d + lb.items.length) % lb.items.length;
    showLightbox();
  }
  function closeLightbox() {
    $('lb').classList.remove('on');
    var v = $('lbMedia').querySelector('video');
    if (v) v.pause();
    $('lbMedia').innerHTML = '';
  }
  $('lbClose').addEventListener('click', closeLightbox);
  $('lbPrev').addEventListener('click', function () { stepLightbox(-1); });
  $('lbNext').addEventListener('click', function () { stepLightbox(1); });
  document.addEventListener('keydown', function (e) {
    if (!$('lb').classList.contains('on')) return;
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowRight') stepLightbox(1);
    else if (e.key === 'ArrowLeft') stepLightbox(-1);
  });

  /* ---------- Arranque ---------- */
  function initIntro() {
    var h = '';
    if (C.logo) h += '<img class="logo" alt="' + esc(C.name || '') + '" src="' + esc(C.logo) + '">';
    h += '<h1>' + esc(intro.title || C.name || '') + '</h1>';
    var sub = intro.subtitle || C.tagline;
    if (sub) h += '<p>' + esc(sub) + '</p>';
    if (scenes.length) h += '<button id="enter" type="button">' + esc(intro.button || 'Ingresar') + '</button>';
    introEl.innerHTML = h;
    var enter = $('enter');
    if (enter) enter.addEventListener('click', function () { go(scenes[0].id, { video: intro.enterVideo }); });
  }

  function initDayNight() {
    var box = $('dnBtn');
    if (!box || !dayNight) return;
    box.hidden = false;
    [dayNight.dia, dayNight.noche].forEach(function (src) { var im = new Image(); im.src = src; });      // la otra imagen queda lista para el cambio
    var btns = Array.prototype.slice.call(box.querySelectorAll('button'));
    btns.forEach(function (b) {
      b.addEventListener('click', function () {
        dnMode = b.getAttribute('data-m') === 'noche' ? 'noche' : 'dia';
        btns.forEach(function (x) { var on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on ? 'true' : 'false'); });
        if (current === 'intro') setBackground(introBg());
        track('modo', dnMode);
      });
    });
  }

  function initTopbar() {
    $('brand').innerHTML = (C.logo ? '<img alt="" src="' + esc(C.logo) + '">' : '') + (C.logo ? '' : '<span>' + esc(C.name || '') + '</span>');
    $('brand').addEventListener('click', function () { go('inicio'); });
    var link = waLink('Hola, quiero más información sobre ' + (C.name || 'el proyecto') + '.');
    var wa = $('waBtn');
    if (link) wa.href = link; else wa.hidden = true;
    var fs = $('fsBtn');
    if (!document.documentElement.requestFullscreen && !document.documentElement.webkitRequestFullscreen) fs.hidden = true;
    var fsLabel = fs.querySelector('.lbl');
    function fsElement() { return document.fullscreenElement || document.webkitFullscreenElement; }
    function fsText() { fsLabel.textContent = fsElement() ? 'Salir de pantalla completa' : 'Pantalla completa'; }
    fsText();
    document.addEventListener('fullscreenchange', fsText);
    document.addEventListener('webkitfullscreenchange', fsText);

    var noteTimer = 0;
    function fsNote(text) {
      var n = $('fsNote');
      n.textContent = text;
      n.classList.add('on');
      clearTimeout(noteTimer);
      noteTimer = setTimeout(function () { n.classList.remove('on'); }, 6000);
    }
    // Algunos navegadores (y los visores embebidos) no dejan activar la pantalla completa desde la página: en ese caso se avisa.
    function fsFail() {
      if (fsElement() || $('fsNote').classList.contains('on')) return;
      if (window.self !== window.top) {
        var w = window.open(location.href, '_blank');
        if (w) return;
      }
      fsNote('Este navegador no permite la pantalla completa desde la página. Probá con la tecla F11 o abrí el link en Chrome.');
    }
    fs.addEventListener('click', function () {
      var el = document.documentElement;
      if (fsElement()) {
        if (document.exitFullscreen) document.exitFullscreen(); else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        return;
      }
      try {
        var p = el.requestFullscreen ? el.requestFullscreen() : (el.webkitRequestFullscreen ? el.webkitRequestFullscreen() : null);
        if (p && p.catch) p.catch(fsFail);
        else if (!p) fsFail();
        // en algunos visores embebidos la solicitud queda pendiente sin responder: si no pasó a pantalla completa, se avisa
        setTimeout(function () { if (!fsElement()) fsFail(); }, 1200);
      } catch (e) { fsFail(); }
    });
  }

  buildMenu();
  initIntro();
  initTopbar();
  initDayNight();

  var start = (location.hash || '').replace(/^#\/?/, '');
  var startId = idOfKey[start] || (byId[start] ? start : '');
  if (startId) {
    go(startId, { instant: true });
  } else {
    showIntro();
  }
})();
</script>
</body>
</html>
