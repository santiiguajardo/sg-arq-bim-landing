<style>/* Showroom virtual — estilos comunes a todas las páginas generadas.
   Todos los showrooms comparten este archivo: solo cambian el color de acento, el logo y el contenido. */
:root {
  --accent: #2f6fed;
  --ink: #f4f5f8;
  --ink-soft: #b4b9c6;
  --glass: rgba(14, 16, 22, .62);
  --glass-line: rgba(255, 255, 255, .16);
  --font-body: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0b0c10; color: var(--ink); font-family: var(--font-body); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font-family: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
[hidden] { display: none !important; }

/* ---------- Fondo (dos capas para el fundido) ---------- */
#stage { position: fixed; inset: 0; background: #0b0c10; }
.bg { position: absolute; inset: 0; opacity: 0; transition: opacity .9s ease, transform 1s cubic-bezier(.2,.7,.2,1); }
.bg.on { opacity: 1; }
.bg video, .bg img { width: 100%; height: 100%; object-fit: cover; display: block; }
#shade { position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(8,9,12,.55) 0%, rgba(8,9,12,.05) 32%, rgba(8,9,12,.05) 55%, rgba(8,9,12,.72) 100%); }

/* ---------- Barra superior ---------- */
#topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; pointer-events: none; }
#topbar > * { pointer-events: auto; }
.pill { text-decoration: none; display: inline-flex; align-items: center; gap: 9px; height: 42px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--glass-line); background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); font-weight: 600; font-size: 11.2px; }
.pill:hover { background: rgba(14, 16, 22, .82); }
.round { width: 42px; height: 42px; padding: 0; justify-content: center; }
.burger { width: 16px; height: 12px; position: relative; display: inline-block; }
.burger::before, .burger::after, .burger i { content: ''; position: absolute; left: 0; right: 0; height: 2px; border-radius: 2px; background: currentColor; }
.burger::before { top: 0; } .burger i { top: 5px; } .burger::after { bottom: 0; }
#brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -.02em; font-size: 12.8px; text-shadow: 0 1px 12px rgba(0,0,0,.5); }
#brand img { height: 24px; width: auto; max-width: 96px; object-fit: contain; }
.tb-right { display: flex; gap: 8px; }
/* selector Día / Noche del inicio */
.pill.dn { padding: 3px; gap: 2px; }
.pill.dn[hidden], body:not(.at-intro) .pill.dn { display: none; }
.dn button { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: inherit; font: inherit; cursor: pointer; transition: background .2s, color .2s; }
.dn button:not(.on):hover { background: rgba(255,255,255,.12); }
.dn button.on { background: #fff; color: #10131a; }
.tb-left { display: flex; align-items: center; gap: 8px; }
/* "Volver": solo aparece si el showroom se abrió desde el sitio del estudio (la landing) */
#backBtn { width: 36px; height: 36px; padding: 0; justify-content: center; }
#backBtn[hidden] { display: none; }
#fsBtn { gap: 8px; padding: 0 16px; }
#fsBtn .ico { font-size: 12.8px; line-height: 1; }

/* ---------- Portada ---------- */
#intro { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; transition: opacity .6s ease, visibility .6s; }
#intro.gone { opacity: 0; visibility: hidden; pointer-events: none; }
#intro .logo { max-height: 77px; max-width: min(45vw, 230px); object-fit: contain; margin-bottom: 18px; filter: drop-shadow(0 6px 24px rgba(0,0,0,.45)); }
#intro h1 { margin: 0; font-weight: 600; font-size: clamp(1.41rem, 4.48vw, 2.94rem); letter-spacing: -.04em; line-height: 1.02; text-shadow: 0 4px 30px rgba(0,0,0,.45); text-wrap: balance; }
#intro p { margin: 14px 0 0; max-width: 560px; font-size: clamp(0.8rem, 1.92vw, 0.96rem); color: #e6e9f0; text-shadow: 0 2px 16px rgba(0,0,0,.5); }
#enter { margin-top: 34px; height: 54px; padding: 0 44px; border: 0; border-radius: 999px; background: #fff; color: #10131a; font-weight: 700; font-size: 12.8px; box-shadow: 0 10px 40px rgba(0,0,0,.35); transition: transform .15s; }
#enter:hover { transform: translateY(-2px); }

/* ---------- Menu ---------- */
#drawerBack { position: fixed; inset: 0; z-index: 40; background: rgba(5,6,9,.5); opacity: 0; visibility: hidden; transition: opacity .3s, visibility .3s; }
#drawer { position: fixed; top: 0; bottom: 0; left: 0; z-index: 41; width: min(360px, 88vw); padding: 22px 22px 18px; display: flex; flex-direction: column; background: rgba(12, 14, 19, .94); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-right: 1px solid var(--glass-line); transform: translateX(-102%); transition: transform .35s cubic-bezier(.2,.7,.2,1); }
body.menu-open #drawer { transform: none; }
body.menu-open #drawerBack { opacity: 1; visibility: visible; }
.d-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.d-head strong { font-size: 14.4px; letter-spacing: -.02em; }
.d-head img { max-height: 34px; max-width: 160px; object-fit: contain; }
#drawer nav { display: flex; flex-direction: column; gap: 2px; flex: 1; overflow-y: auto; }
#drawer nav button { text-align: left; background: transparent; border: 0; padding: 13px 12px; border-radius: 10px; font-size: 13.6px; font-weight: 600; letter-spacing: -.01em; color: var(--ink-soft); }
#drawer nav button:hover { background: rgba(255,255,255,.06); color: #fff; }
#drawer nav button.on { color: #fff; background: color-mix(in srgb, var(--accent) 30%, transparent); }
.d-foot { border-top: 1px solid var(--glass-line); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; font-size: 10.8px; color: var(--ink-soft); }
.d-foot a { text-decoration: none; }
.d-foot a:hover { color: #fff; }
.d-foot .credit { font-family: var(--font-mono); font-size: 9px; letter-spacing: .14em; text-transform: uppercase; opacity: .7; margin-top: 6px; }

/* ---------- Panel de contenido ---------- */
#panel { position: fixed; z-index: 10; left: 24px; bottom: 24px; top: 84px; width: min(500px, calc(100vw - 48px)); display: flex; flex-direction: column; justify-content: flex-end; pointer-events: none; transition: opacity .5s ease, transform .5s ease; }
#panel.hide { opacity: 0; transform: translateY(14px); }
.card { pointer-events: auto; max-height: 100%; overflow-y: auto; padding: 26px 26px 22px; border-radius: 22px; border: 1px solid var(--glass-line); background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.25) transparent; }
.eyebrow { font-family: var(--font-mono); font-size: 9px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: color-mix(in srgb, var(--accent) 55%, #fff); margin: 0 0 10px; }
.card h2 { margin: 0 0 10px; font-size: clamp(1.36rem, 2.72vw, 1.84rem); font-weight: 800; letter-spacing: -.03em; line-height: 1.05; }
.card .desc { margin: 0 0 18px; color: #dfe3ec; font-size: 12.4px; line-height: 1.55; white-space: pre-line; }

/* Galería */
.gal { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.gal button { position: relative; padding: 0; border: 0; border-radius: 12px; overflow: hidden; aspect-ratio: 4 / 3; background: #1a1d26; }
.gal img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .35s; }
.gal button:hover img { transform: scale(1.06); }
.gal .vp { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.28); font-size: 16px; }
.gal-more { margin-top: 10px; font-size: 10px; color: var(--ink-soft); }

/* Unidades */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.chip { height: 32px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--glass-line); background: transparent; font-size: 10.4px; font-weight: 600; color: var(--ink-soft); }
.chip.on { background: #fff; color: #10131a; border-color: #fff; }
.units { display: flex; flex-direction: column; gap: 8px; }
.unit { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 13px 14px; border-radius: 14px; border: 1px solid var(--glass-line); background: rgba(255,255,255,.04); }
.unit b { font-size: 12.8px; letter-spacing: -.01em; }
.unit .meta { grid-column: 1; color: var(--ink-soft); font-size: 10.4px; }
.unit .price { grid-column: 2; grid-row: 1 / span 2; align-self: center; text-align: right; font-weight: 800; font-size: 12.8px; font-variant-numeric: tabular-nums; }
.unit .act { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; }
.st { font-family: var(--font-mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; border: 1px solid currentColor; }
.st.disponible { color: #4ade80; } .st.reservada { color: #fbbf24; } .st.vendida { color: #f87171; }
.unit.vendida { opacity: .55; }
.empty { color: var(--ink-soft); font-size: 11.2px; padding: 8px 0; }

/* Ubicacion */
.map { width: 100%; height: 230px; border: 0; border-radius: 14px; margin-bottom: 14px; filter: grayscale(.25) contrast(1.05); }
.poi { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--glass-line); font-size: 11.6px; }
.poi span:last-child { color: var(--ink-soft); white-space: nowrap; }

/* Botones y contacto */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 22px; border-radius: 12px; border: 1px solid var(--glass-line); background: transparent; font-weight: 700; font-size: 11.6px; text-decoration: none; }
.btn.primary { background: #fff; color: #10131a; border-color: #fff; }
.btn:hover { transform: translateY(-1px); }
.btn.sm { height: 36px; padding: 0 16px; font-size: 10.4px; border-radius: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.cinfo { margin: 16px 0 0; display: flex; flex-direction: column; gap: 6px; font-size: 11.6px; color: #dfe3ec; }
.form { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
.form input, .form textarea { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--glass-line); background: rgba(255,255,255,.06); color: #fff; font: inherit; font-size: 11.6px; }
.form input::placeholder, .form textarea::placeholder { color: #8c92a1; }
.form textarea { min-height: 84px; resize: vertical; }

/* ---------- Transicion (video de IA entre secciones) ---------- */
#tr { position: fixed; inset: 0; z-index: 60; background: #000; opacity: 0; visibility: hidden; transition: opacity .35s ease, visibility .35s; }
#tr.on { opacity: 1; visibility: visible; }
#tr video { width: 100%; height: 100%; object-fit: cover; }
#skip { position: absolute; right: 18px; bottom: 22px; }

/* ---------- Visor de fotos / videos ---------- */
#lb { position: fixed; inset: 0; z-index: 70; background: rgba(4,5,8,.94); display: none; flex-direction: column; }
#lb.on { display: flex; }
#lbMain { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 56px 64px 8px; }
#lbMain img, #lbMain video { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; }
#lbClose { position: absolute; top: 14px; right: 14px; z-index: 2; }
.lb-nav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; }
#lbPrev { left: 12px; } #lbNext { right: 12px; }
#lbStrip { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px 16px; justify-content: center; scrollbar-width: thin; }
#lbStrip button { flex: 0 0 auto; width: 92px; height: 64px; padding: 0; border: 2px solid transparent; border-radius: 9px; overflow: hidden; background: #1a1d26; opacity: .6; position: relative; }
#lbStrip button.on { opacity: 1; border-color: var(--accent); }
#lbStrip img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
#lbStrip .vp { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.3); font-size: 11.2px; }
#lbCap { text-align: center; color: var(--ink-soft); font-size: 10.4px; padding: 0 16px 4px; min-height: 20px; }

/* ---------- Pisos (de la terraza hacia abajo) ---------- */
#floorNav { position: fixed; z-index: 15; right: 16px; top: 76px; bottom: 24px; width: 84px; display: none; flex-direction: column; gap: 6px; padding: 8px; border-radius: 18px; border: 1px solid var(--glass-line); background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
body.in-floors #floorNav { display: flex; }
#fList { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; scrollbar-width: none; }
#fList::-webkit-scrollbar { display: none; }
#fList button, .f-step { flex: 0 0 auto; min-height: 42px; padding: 6px 4px; border-radius: 11px; border: 0; background: rgba(255,255,255,.92); color: #10131a; font-weight: 700; font-size: 10px; line-height: 1.15; text-align: center; }
#fList button:hover, .f-step:hover { background: #fff; }
#fList button.on { background: var(--accent); color: #fff; }
.f-step { min-height: 34px; background: rgba(255,255,255,.14); color: #fff; font-size: 11.2px; }
.f-step:hover { background: rgba(255,255,255,.28); }
.f-step:disabled { opacity: .3; cursor: default; }
#floorInfo { position: fixed; z-index: 15; left: 24px; bottom: 24px; display: none; flex-direction: column; min-width: 230px; max-width: min(340px, calc(100vw - 130px)); border-radius: 16px; border: 1px solid var(--glass-line); background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); overflow: hidden; }
body.in-floors #floorInfo { display: flex; }
.fi-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; width: 100%; padding: 13px 16px; border: 0; background: transparent; color: inherit; text-align: left; cursor: default; }
#floorInfo.has-list .fi-head { cursor: pointer; }
.fi-t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fi-t strong { font-size: 16.8px; letter-spacing: -.02em; }
.fi-sub { font-size: 10px; color: var(--ink-soft); }
.fi-chev { font-size: 10.4px; color: var(--ink-soft); transition: transform .2s; }
#floorInfo.open .fi-chev { transform: rotate(180deg); }
.fi-list { display: none; flex-direction: column; max-height: 42vh; overflow-y: auto; border-top: 1px solid var(--glass-line); scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.25) transparent; }
#floorInfo.open .fi-list { display: flex; }
.fi-row { display: grid; grid-template-columns: 12px auto 1fr auto; gap: 10px; align-items: center; width: 100%; padding: 10px 16px; border: 0; border-top: 1px solid rgba(255,255,255,.06); background: transparent; color: inherit; text-align: left; font-size: 10.8px; }
.fi-row:first-child { border-top: 0; }
.fi-row:hover { background: rgba(255,255,255,.07); }
/* mini ficha que acompaña al mouse sobre las zonas */
#zoneTip { position: fixed; z-index: 40; pointer-events: none; min-width: 150px; max-width: 240px; padding: 10px 13px; border-radius: 12px; border: 1px solid var(--glass-line); background: rgba(12, 14, 19, .92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 10px 30px rgba(0,0,0,.45); color: #fff; }
#zoneTip[hidden] { display: none; }
#zoneTip .zt-h { display: flex; align-items: center; gap: 8px; font-size: 13.6px; }
#zoneTip .zt-h i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
#zoneTip .zt-h span { margin-left: auto; font-family: var(--font-mono); font-size: 9.6px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
#zoneTip .zt-m { margin-top: 5px; font-size: 12px; color: var(--ink-soft); }
#zoneTip .zt-p { margin-top: 6px; font-size: 14.4px; font-weight: 800; letter-spacing: -.02em; }
.fi-row i { width: 10px; height: 10px; border-radius: 50%; }
.fi-row span { color: var(--ink-soft); font-size: 10px; }
.fi-row em { font-style: normal; font-size: 9.6px; font-weight: 700; }
#floorInfo .lg { display: flex; gap: 12px; padding: 0 16px 13px; flex-wrap: wrap; }
#floorInfo .lg span { display: inline-flex; align-items: center; gap: 6px; font-size: 9.6px; color: var(--ink); }
#floorInfo .lg span::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
body.in-floors #panel { display: none; }

.map.lm { position: relative; z-index: 0; isolation: isolate; height: 340px; filter: none; background: #1a1d26; overflow: hidden; }
.map.lm .maplibregl-ctrl-attrib { font-size: 10px; }
.poi-pill { display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 7px; margin-left: 4px; border-radius: 999px; background: #fff; color: #10131a; font-size: 9.2px; font-weight: 700; box-shadow: 0 1px 6px rgba(0,0,0,.35); white-space: nowrap; max-width: 210px; overflow: hidden; text-overflow: ellipsis; }
.poi-pill i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.pd { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; }
.mk-wrap { width: 34px; height: 34px; }
.mk { width: 34px; height: 34px; border-radius: 50% 50% 50% 0; background: var(--accent); border: 3px solid #fff; box-shadow: 0 3px 10px rgba(0,0,0,.5); transform: rotate(-45deg); }
.addr { margin: 0 0 12px; font-size: 12.8px; font-weight: 600; letter-spacing: -.01em; }

/* ---------- Plantas con unidades ---------- */
#floorStage { position: fixed; z-index: 12; display: none; pointer-events: none; transition: opacity .35s ease; }
body.in-floors #floorStage { display: block; }
#floorStage.swap { opacity: 0; }
/* capa que recibe el deslizamiento horizontal de la planta (celular): los puntos y las zonas también dejan arrastrar */
#floorPan { position: fixed; inset: 0; z-index: 11; display: none; touch-action: none; }
body.in-floors #floorPan { display: block; }
#floorStage .zone, .pin { touch-action: none; }
#panHint { position: fixed; top: 68px; left: 50%; transform: translateX(-50%); z-index: 20; display: none; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; font-size: 10.4px; font-weight: 600; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.7); transition: opacity .6s; }
body.in-floors #panHint.on { display: flex; }
#panHint .ph-t { position: relative; width: 96px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.28); }
#panHint .ph-t i { position: absolute; top: 0; height: 100%; border-radius: 2px; background: #fff; }
#panHint.used .ph-x { opacity: 0; transition: opacity .6s; }
body.card-open #panHint .ph-x { opacity: 0; }
#floorStage svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
#floorStage .zone { fill: var(--c); fill-opacity: 0; stroke: var(--c); stroke-opacity: 0; stroke-width: 2; vector-effect: non-scaling-stroke; pointer-events: all; cursor: pointer; transition: fill .2s, stroke .2s, fill-opacity .2s, stroke-opacity .2s; }
/* En reposo las zonas no se ven (solo los puntos con el código). Al pasar el mouse o tocar aparecen con el color propio que se les eligió (--h) o, si no tienen, el de su estado (--c) */
#floorStage .zone:hover, #floorStage .zone.hov { fill: var(--h, var(--c)); stroke: var(--h, var(--c)); fill-opacity: .55; stroke-opacity: 1; stroke-width: 3; filter: drop-shadow(0 0 8px var(--h, var(--c))); }
#floorStage .zone.common { stroke-dasharray: 7 5; }
#floorStage .zone.sel { fill: var(--h, var(--c)); stroke: var(--h, var(--c)); fill-opacity: .6; stroke-opacity: 1; stroke-width: 3.5; }
